# pnpm settings for this repo (single package — there is no `packages:` list).
#
# Why this file exists: pnpm 11+ no longer reads the "pnpm" field in
# package.json, nor pnpm-specific settings in .npmrc. Zeabur builds with
# pnpm 11+, so the security overrides and the apple-sign-in patch only take
# effect there if they live here. pnpm 10 (local + GitHub Actions) reads this
# file too, so it stays the single source of truth for both.
#
# Any lockfile regeneration must use --config.minimum-release-age=1440
# (Zeabur's pnpm refuses packages published less than 24 hours ago).

# Skip ALL dependency lifecycle scripts (preinstall / install / postinstall).
# Mirrors `ignore-scripts=true` in .npmrc, which pnpm 11+ ignores — without it
# Zeabur's install stops with ERR_PNPM_IGNORED_BUILDS. See .npmrc for why
# none of our deps need their install scripts.
ignoreScripts: true

# Mirrors public-hoist-pattern in .npmrc (sharp binaries at top level).
publicHoistPattern:
  - '*sharp*'
  - '@img/*'

# Was "onlyBuiltDependencies" in package.json; pnpm 11+ only knows allowBuilds
# (pnpm 10.26+ reads it too). Moot while ignoreScripts is on, kept for when
# someone runs `pnpm rebuild`.
allowBuilds:
  electron: true
  sharp: true

patchedDependencies:
  '@capacitor-community/apple-sign-in': patches/@capacitor-community__apple-sign-in.patch

# Security pins (848376b, xmldom split in #189).
overrides:
  'lodash@<4.18.0': '^4.18.1'
  'ws@<8.21.0': '^8.22.0'
  'postcss@<8.5.18': '^8.5.28'
  'nanoid@<3.3.18': '^3.3.19'
  'browserslist@<4.28.7': '^4.29.3'
  'js-yaml@<4.3.2': '^4.3.2'
  'brace-expansion@<1.1.20': '^1.1.21'
  'brace-expansion@>=2.0.0 <2.1.6': '^2.1.7'
  'brace-expansion@>=5.0.0 <5.0.11': '^5.0.12'
  'replace>minimatch': '3.1.5'
  '@xmldom/xmldom@<0.8.15': '^0.8.15'
  '@xmldom/xmldom@>=0.9.0 <0.9.12': '^0.9.12'
  '@capacitor/cli@8>tar': '^7.5.22'
