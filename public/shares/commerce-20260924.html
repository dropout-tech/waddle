方案，非所有功能逐級累加<\/text><\/svg><\/figure><p><button class=\"primary\" onclick=\"openFeatureDoc(0)\">查看完整功能文件<\/button> <button onclick=\"openFeatureDoc(1)\">查看兩案功能對照<\/button><\/p>", "sourceidx": 17, "cls": ""}, {"title": "方案草案：模板、進階與客製", "desc": "以約 10 種基礎模板為共同起點；往設計師設計或電商功能升級，也可組合兩條路線。", "body": "<figure class=\"proposal-visual\" aria-label=\"標準模板、進階視覺與專案設計的不同範圍\"><svg viewBox=\"0 0 1100 240\" role=\"img\" aria-label=\"標準模板、進階視覺與專案設計的不同範圍\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"arrow-240\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10\" fill=\"#ad7059\"/><\/marker><\/defs><rect x=\"30\" y=\"15\" width=\"270\" height=\"160\" rx=\"12\" fill=\"#fffdfa\" stroke=\"#cfc5b8\"/><path d=\"M30 43H300\" stroke=\"#cfc5b8\"/><circle cx=\"46\" cy=\"29\" r=\"3\" fill=\"#bd8d76\"/><circle cx=\"59\" cy=\"29\" r=\"3\" fill=\"#bd8d76\"/><circle cx=\"72\" cy=\"29\" r=\"3\" fill=\"#bd8d76\"/><rect x=\"44\" y=\"57\" width=\"242\" height=\"50\" rx=\"5\" fill=\"#dce8d9\"/><rect x=\"44.0\" y=\"120\" width=\"76.66666666666667\" height=\"42\" rx=\"3\" fill=\"#eee9e0\"/><rect x=\"124.66666666666667\" y=\"120\" width=\"76.66666666666667\" height=\"42\" rx=\"3\" fill=\"#eee9e0\"/><rect x=\"205.33333333333334\" y=\"120\" width=\"76.66666666666667\" height=\"42\" rx=\"3\" fill=\"#eee9e0\"/><text x=\"165.0\" y=\"207\" text-anchor=\"middle\" font-size=\"21\" fill=\"#40382e\" font-family=\"inherit\">標準模板 · 固定組合<\/text><rect x=\"414\" y=\"15\" width=\"270\" height=\"160\" rx=\"12\" fill=\"#fffdfa\" stroke=\"#cfc5b8\"/><path d=\"M414 43H684\" stroke=\"#cfc5b8\"/><circle cx=\"430\" cy=\"29\" r=\"3\" fill=\"#bd8d76\"/><circle cx=\"443\" cy=\"29\" r=\"3\" fill=\"#bd8d76\"/><circle cx=\"456\" cy=\"29\" r=\"3\" fill=\"#bd8d76\"/><rect x=\"428\" y=\"57\" width=\"242\" height=\"50\" rx=\"5\" fill=\"#eed9cc\"/><rect x=\"428.0\" y=\"120\" width=\"76.66666666666667\" height=\"42\" rx=\"3\" fill=\"#eee9e0\"/><rect x=\"508.6666666666667\" y=\"120\" width=\"76.66666666666667\" height=\"42\" rx=\"3\" fill=\"#eee9e0\"/><rect x=\"589.3333333333334\" y=\"120\" width=\"76.66666666666667\" height=\"42\" rx=\"3\" fill=\"#eee9e0\"/><text x=\"549.0\" y=\"207\" text-anchor=\"middle\" font-size=\"21\" fill=\"#40382e\" font-family=\"inherit\">進階方案 · 約定延伸<\/text><rect x=\"799\" y=\"15\" width=\"270\" height=\"160\" rx=\"12\" fill=\"#fffdfa\" stroke=\"#cfc5b8\"/><path d=\"M799 43H1069\" stroke=\"#cfc5b8\"/><circle cx=\"815\" cy=\"29\" r=\"3\" fill=\"#bd8d76\"/><circle cx=\"828\" cy=\"29\" r=\"3\" fill=\"#bd8d76\"/><circle cx=\"841\" cy=\"29\" r=\"3\" fill=\"#bd8d76\"/><rect x=\"813\" y=\"57\" width=\"242\" height=\"75\" rx=\"5\" fill=\"#e7d9d9\"/><rect x=\"813.0\" y=\"143\" width=\"76.66666666666667\" height=\"25\" rx=\"3\" fill=\"#eee9e0\"/><rect x=\"893.6666666666666\" y=\"143\" width=\"76.66666666666667\" height=\"25\" rx=\"3\" fill=\"#eee9e0\"/><rect x=\"974.3333333333334\" y=\"143\" width=\"76.66666666666667\" height=\"25\" rx=\"3\" fill=\"#eee9e0\"/><text x=\"934.0\" y=\"207\" text-anchor=\"middle\" font-size=\"21\" fill=\"#40382e\" font-family=\"inherit\">專案設計 · 獨立範圍<\/text><path d=\"M323 95L390 95\" fill=\"none\" stroke=\"#ad7059\" stroke-width=\"2.5\" marker-end=\"url(#arrow-240)\"/><path d=\"M708 95L774 95\" fill=\"none\" stroke=\"#ad7059\" stroke-width=\"2.5\" marker-end=\"url(#arrow-240)\"/><text x=\"550\" y=\"237\" text-anchor=\"middle\" font-size=\"17\" fill=\"#40382e\" font-family=\"inherit\">視覺示意，非實際模板；設計可配合提摩，工程客製另估<\/text><\/svg><\/figure><div class=\"tabs\" id=\"scope-tabs\" role=\"group\" aria-label=\"專案情境\"><\/div><div id=\"scope-body\"><\/div><p class=\"callout\">方案分級為本次草案，164 項尚待逐項歸類。授權、交易正確與故障恢復依功能風險納入標配。<\/p>", "sourceidx": 4, "cls": ""}, {"title": "為什麼會有這個提案？過去有一些起點", "desc": "九豆與 nova air 提供交易經驗；PIMI 提醒客製邊界；萊特帶來快速套版的想像。", "body": "<div class=\"tabs\" id=\"case-tabs\" role=\"group\" aria-label=\"案例\"><\/div><div id=\"case-body\" class=\"case-body\"><\/div><p class=\"footnote\">依既有文件與程式核對；歷史驗證不代表今天正式站已重新驗收。<\/p>", "sourceidx": 1, "cls": ""}, {"title": "萊特：實作原理、互動示範與延伸", "desc": "請大家從操作與結構評估：這種模組形式能否用於網站方案？正式啟動還缺哪些要素？", "body": "<div id=\"lite-mode-tabs\" class=\"tabs\" role=\"group\" aria-label=\"萊特說明模式\"><\/div><div id=\"lite-current\"><figure class=\"proposal-visual\" aria-label=\"萊特現況：表單生成 Teacher 資料，存在瀏覽器或編碼連結，公開頁依模板呈現\"><svg viewBox=\"0 0 1100 360\" role=\"img\" aria-label=\"萊特現況：表單生成 Teacher 資料，存在瀏覽器或編碼連結，公開頁依模板呈現\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"arrow-360\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10\" fill=\"#ad7059\"/><\/marker><\/defs><rect x=\"10\" y=\"20\" width=\"230\" height=\"88\" rx=\"14\" fill=\"#fffdfa\" stroke=\"#d8d0c5\"/><text x=\"125.0\" y=\"58\" text-anchor=\"middle\" font-size=\"24\" fill=\"#40382e\" font-family=\"inherit\">管理頁填表<\/text><text x=\"125.0\" y=\"90\" text-anchor=\"middle\" font-size=\"18\" fill=\"#40382e\" font-family=\"inherit\">姓名／聯絡／模板<\/text><path d=\"M255 64L300 64\" fill=\"none\" stroke=\"#ad7059\" stroke-width=\"2.5\" marker-end=\"url(#arrow-360)\"/><rect x=\"320\" y=\"20\" width=\"255\" height=\"88\" rx=\"14\" fill=\"#e2ebdf\" stroke=\"#d8d0c5\"/><text x=\"447.5\" y=\"58\" text-anchor=\"middle\" font-size=\"24\" fill=\"#40382e\" font-family=\"inherit\">buildDefaultTeacher<\/text><text x=\"447.5\" y=\"90\" text-anchor=\"middle\" font-size=\"18\" fill=\"#40382e\" font-family=\"inherit\">組出 Teacher 資料<\/text><path d=\"M585 64L645 64\" fill=\"none\" stroke=\"#ad7059\" stroke-width=\"2.5\" marker-end=\"url(#arrow-360)\"/><rect x=\"665\" y=\"20\" width=\"425\" height=\"88\" rx=\"14\" fill=\"#fffdfa\" stroke=\"#d8d0c5\"/><text x=\"877.5\" y=\"58\" text-anchor=\"middle\" font-size=\"24\" fill=\"#40382e\" font-family=\"inherit\">同一份資料，兩種保存／傳遞<\/text><text x=\"877.5\" y=\"90\" text-anchor=\"middle\" font-size=\"18\" fill=\"#40382e\" font-family=\"inherit\">不是每位老師重新部署網站<\/text><path d=\"M765 120L710 175\" fill=\"none\" stroke=\"#ad7059\" stroke-width=\"2.5\" marker-end=\"url(#arrow-360)\"/><path d=\"M985 120L985 175\" fill=\"none\" stroke=\"#ad7059\" stroke-width=\"2.5\" marker-end=\"url(#arrow-360)\"/><rect x=\"575\" y=\"185\" width=\"245\" height=\"88\" rx=\"14\" fill=\"#fffdfa\" stroke=\"#d8d0c5\"/><text x=\"697.5\" y=\"223\" text-anchor=\"middle\" font-size=\"24\" fill=\"#40382e\" font-family=\"inherit\">localStorage<\/text><text x=\"697.5\" y=\"255\" text-anchor=\"middle\" font-size=\"18\" fill=\"#40382e\" font-family=\"inherit\">本機瀏覽器暫存<\/text><rect x=\"845\" y=\"185\" width=\"245\" height=\"88\" rx=\"14\" fill=\"#fffdfa\" stroke=\"#d8d0c5\"/><text x=\"967.5\" y=\"223\" text-anchor=\"middle\" font-size=\"24\" fill=\"#40382e\" font-family=\"inherit\">分享網址 ?d=…<\/text><text x=\"967.5\" y=\"255\" text-anchor=\"middle\" font-size=\"18\" fill=\"#40382e\" font-family=\"inherit\">編碼的資料快照<\/text><path d=\"M555 230L460 230\" fill=\"none\" stroke=\"#ad7059\" stroke-width=\"2.5\" marker-end=\"url(#arrow-360)\"/><rect x=\"160\" y=\"185\" width=\"285\" height=\"88\" rx=\"14\" fill=\"#f1e4d6\" stroke=\"#d8d0c5\"/><text x=\"302.5\" y=\"223\" text-anchor=\"middle\" font-size=\"24\" fill=\"#40382e\" font-family=\"inherit\">公開頁＋A／B／C<\/text><text x=\"302.5\" y=\"255\" text-anchor=\"middle\" font-size=\"18\" fill=\"#40382e\" font-family=\"inherit\">讀取資料，切換樣式<\/text><text x=\"550\" y=\"335\" text-anchor=\"middle\" font-size=\"19\" fill=\"#40382e\" font-family=\"inherit\">網址有 d：優先解碼；沒有可用 d：查靜態樣本或本機資料<\/text><\/svg><\/figure><p class=\"small\">一鍵建立＝產生結構化資料，再由同一套 Next.js／React 頁面呈現。編碼網址不是加密；它分享的是當時快照，不是可同步更新的中央版本。<\/p><\/div><div id=\"lite-interactive\" hidden><div class=\"lite-demo\"><form id=\"lite-form\"><label>名稱<input id=\"lite-name\" value=\"小光老師\" maxlength=\"30\" required><\/label><label>服務名稱<input id=\"lite-service\" value=\"親子魔術體驗課\" maxlength=\"40\" required><\/label><label>簡介<textarea id=\"lite-bio\" maxlength=\"180\" rows=\"2\">用魔術引發好奇，陪孩子練習表達與自信。<\/textarea><\/label><label>版型<select id=\"lite-template\"><option value=\"A\">A · 經典介紹<\/option><option value=\"B\">B · 主題海報<\/option><option value=\"C\">C · 服務目錄<\/option><\/select><\/label><div class=\"record-actions\"><button class=\"primary\" type=\"submit\">生成預覽<\/button><button type=\"button\" onclick=\"resetLite()\">重設<\/button><\/div><p id=\"lite-status\" class=\"small\" role=\"status\">修改資料後，按「生成預覽」。<\/p><\/form><div><div class=\"small\">網站預覽 · 拖拉模組標籤排序（手機可用 ↑ ↓）<\/div><div id=\"lite-preview\" aria-live=\"polite\"><\/div><\/div><\/div><p class=\"footnote\">依萊特資料套版概念製作的簡報互動示範，非原系統完整版本；資料只在本頁暫存，不會發布或建立帳號。<\/p><\/div><div id=\"lite-future\" hidden><figure class=\"proposal-visual\" aria-label=\"延伸提案：資料庫與權限支援正式網站發布，電商另接商務核心\"><svg viewBox=\"0 0 1100 360\" role=\"img\" aria-label=\"延伸提案：資料庫與權限支援正式網站發布，電商另接商務核心\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"arrow-360\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10\" fill=\"#ad7059\"/><\/marker><\/defs><rect x=\"10\" y=\"15\" width=\"255\" height=\"88\" rx=\"14\" fill=\"#e2ebdf\" stroke=\"#d8d0c5\"/><text x=\"137.5\" y=\"53\" text-anchor=\"middle\" font-size=\"24\" fill=\"#40382e\" font-family=\"inherit\">保留：資料＋模板<\/text><text x=\"137.5\" y=\"85\" text-anchor=\"middle\" font-size=\"18\" fill=\"#40382e\" font-family=\"inherit\">固定欄位與共用區塊<\/text><path d=\"M280 60L350 60\" fill=\"none\" stroke=\"#ad7059\" stroke-width=\"2.5\" marker-end=\"url(#arrow-360)\"/><rect x=\"370\" y=\"15\" width=\"340\" height=\"88\" rx=\"14\" fill=\"#fffdfa\" stroke=\"#d8d0c5\"/><text x=\"540.0\" y=\"53\" text-anchor=\"middle\" font-size=\"24\" fill=\"#40382e\" font-family=\"inherit\">補齊：後端 API＋登入授權<\/text><text x=\"540.0\" y=\"85\" text-anchor=\"middle\" font-size=\"18\" fill=\"#40382e\" font-family=\"inherit\">資料庫／素材儲存／版本<\/text><path d=\"M725 60L790 60\" fill=\"none\" stroke=\"#ad7059\" stroke-width=\"2.5\" marker-end=\"url(#arrow-360)\"/><rect x=\"810\" y=\"15\" width=\"280\" height=\"88\" rx=\"14\" fill=\"#f1e4d6\" stroke=\"#d8d0c5\"/><text x=\"950.0\" y=\"53\" text-anchor=\"middle\" font-size=\"24\" fill=\"#40382e\" font-family=\"inherit\">預覽 → 確認 → 發布<\/text><text x=\"950.0\" y=\"85\" text-anchor=\"middle\" font-size=\"18\" fill=\"#40382e\" font-family=\"inherit\">共用發布流程<\/text><path d=\"M950 115L740 190\" fill=\"none\" stroke=\"#ad7059\" stroke-width=\"2.5\" marker-end=\"url(#arrow-360)\"/><path d=\"M950 115L950 190\" fill=\"none\" stroke=\"#ad7059\" stroke-width=\"2.5\" marker-end=\"url(#arrow-360)\"/><rect x=\"465\" y=\"205\" width=\"315\" height=\"100\" rx=\"14\" fill=\"#e2ebdf\" stroke=\"#d8d0c5\"/><text x=\"622.5\" y=\"243\" text-anchor=\"middle\" font-size=\"24\" fill=\"#40382e\" font-family=\"inherit\">形象網站<\/text><text x=\"622.5\" y=\"275\" text-anchor=\"middle\" font-size=\"18\" fill=\"#40382e\" font-family=\"inherit\">內容／SEO／聯絡入口<\/text><rect x=\"805\" y=\"205\" width=\"285\" height=\"100\" rx=\"14\" fill=\"#ebdfdf\" stroke=\"#d8d0c5\"/><text x=\"947.5\" y=\"243\" text-anchor=\"middle\" font-size=\"24\" fill=\"#40382e\" font-family=\"inherit\">電商網站<\/text><text x=\"947.5\" y=\"275\" text-anchor=\"middle\" font-size=\"18\" fill=\"#40382e\" font-family=\"inherit\">另接商品／付款／訂單<\/text><text x=\"215\" y=\"228\" text-anchor=\"middle\" font-size=\"25\" fill=\"#40382e\" font-family=\"inherit\">依方案延伸<\/text><text x=\"215\" y=\"264\" text-anchor=\"middle\" font-size=\"18\" fill=\"#40382e\" font-family=\"inherit\">視覺設計與工程客製分開<\/text><text x=\"550\" y=\"345\" text-anchor=\"middle\" font-size=\"18\" fill=\"#40382e\" font-family=\"inherit\">此圖為延伸提案；資料保存、授權與交易整合尚需實作驗證<\/text><\/svg><\/figure><p class=\"small\">第一步：伺服器保存與站點權限。第二步：草稿、正式版本與回復。第三步：依方案加入內容管理或商務核心；金流與訂單需另做正反向驗收。<\/p><\/div>", "sourceidx": 6, "cls": ""}, {"title": "技術上，為什麼可以反覆產生網站？", "desc": "關鍵是把內容、畫面與商務邏輯拆開，再用固定規格接起來。", "body": "<div class=\"tech-chain\"><div><b>結構化設定<\/b><small>品牌、模板 ID<br>區塊順序、啟用功能<\/small><\/div><span>→<\/span><div><b>共用元件<\/b><small>讀同一種欄位<br>依模板組合畫面<\/small><\/div><span>→<\/span><div><b>獨立服務<\/b><small>內容管理／商務 API<br>沿用既有功能模組<\/small><\/div><span>→<\/span><div><b>自動建置<\/b><small>固定程式版本＋設定<br>產生預覽與部署<\/small><\/div><\/div><div class=\"editorial\"><div><h3>萊特已示範的原理<\/h3><p>Teacher 資料與模板分離，同一份資料可切換畫面。拖拉示範把順序變成設定，不必重寫頁面。<\/p><\/div><div><h3>延伸所需的關鍵<\/h3><p>統一欄位、區塊接口與模組相依關係；再補正式資料保存、權限、版本與建置工具。<\/p><\/div><div><h3>電商也能模組化<\/h3><p>商務引擎提供商品、訂單、庫存等能力；店面透過 API 使用，視覺模板與交易邏輯分開維護。<\/p><\/div><div><h3>AI 的位置<\/h3><p>協助文案、素材初稿與開發；反覆建站的基礎是固定規格與可測試模組，仍需整合及驗證。<\/p><\/div><\/div><p class=\"footnote\">依萊特原專案、<a href=\"https://react.dev/learn/your-first-component\" target=\"_blank\" rel=\"noopener\">React 元件<\/a>與 <a href=\"https://docs.medusajs.com/learn/introduction/architecture\" target=\"_blank\" rel=\"noopener\">Medusa 架構<\/a>整理；完整建站工具仍屬提案。<\/p>", "sourceidx": 19, "cls": ""}, {"title": "客戶選模板，我們建置與部署", "desc": "純形象站、電商與進階方案，均由我們設定、建置、驗收並部署上線。", "body": "<div class=\"tabs\" id=\"model-tabs\" role=\"group\" aria-label=\"服務交付階段\"><\/div><div id=\"model-body\"><\/div><p class=\"callout\">交付的是可上線使用的網站：模板方案＋內容導入＋功能設定＋部署驗收；後續維護另定範圍。<\/p><p class=\"small\">共用核心、客戶專屬成果與第三方素材的重用權利，需先核對既有合約。<\/p>", "sourceidx": 7, "cls": ""}, {"title": "技術構想：設定、交易核心與建置流程", "desc": "建議分成三層：設定決定畫面、核心處理交易、建置流程建立商店。", "body": "<div class=\"tabs\" id=\"arch-tabs\" role=\"group\" aria-label=\"架構模式\"><\/div><div id=\"architecture\"><\/div><p id=\"arch-note\" class=\"callout\"><\/p><p class=\"small\">供技術討論的草圖，尚未完成整合；實作難度與成本請團隊一起評估。參考：<a href=\"https://docs.medusajs.com/learn/fundamentals/modules\" target=\"_blank\" rel=\"noopener\">Medusa 模組文件<\/a>、<a href=\"https://nextjs.org/docs/app/getting-started/server-and-client-components\" target=\"_blank\" rel=\"noopener\">Next.js 元件文件<\/a>。<\/p>", "sourceidx": 8, "cls": ""}, {"title": "同一套核心模組，反覆建立不同網站", "desc": "共用程式與模組；每個客戶換品牌、內容、模板與選配設定，由我們建置部署。", "body": "<div class=\"reuse-base\"><span class=\"tier-label\">共同底座 · 形象站與電商都能沿用<\/span><h3>模板與區塊 ＋ 內容管理 ＋ 網站設定 ＋ 建置部署<\/h3><p>導覽／頁尾、主視覺、圖文／FAQ／聯絡區塊、素材管理、SEO、管理者權限、版本與發布工具<\/p><\/div><div class=\"reuse-branches\"><article><span class=\"tier-label\">路線 A ／ 純形象網站<\/span><h3>組合展示與內容模組<\/h3><p>品牌介紹、服務／作品列表、聯絡表單<br>選配：文章、多語、預約、進階設計<\/p><\/article><article><span class=\"tier-label\">路線 B ／ 電商網站<\/span><h3>共同底座＋交易核心<\/h3><p>商品／規格、庫存、購物車／結帳、訂單<br>金流／發票、通知；會員／促銷依方案加入<\/p><\/article><\/div><div class=\"replica-strip\"><strong>同一版本的核心<\/strong><span>→ A 品牌＋模板 01<\/span><span>→ B 品牌＋模板 04<\/span><span>→ C 品牌＋模板 07<\/span><\/div><p class=\"small\">複用的是程式、規格與建置工具；客戶資料、金鑰與交易資料各自隔離。共同底座為待整理方向，約 10 種模板為規劃數量。<\/p>", "sourceidx": 3, "cls": ""}, {"title": "建站系統本身，也要有可重用的模組", "desc": "把每案反覆做的工作做成內部工具；輸入客戶設定，組合網站，再由我們部署。", "body": "<div class=\"editorial\"><div><h3>01 設定與驗證<\/h3><p>保存品牌、template_id、模組清單與內容；檢查必填欄位與相依功能。每案只換設定。<\/p><\/div><div><h3>02 模板與區塊渲染<\/h3><p>共用頁面、區塊與樣式規則；拖拉只改區塊順序，模板依同一份內容產生畫面。<\/p><\/div><div><h3>03 內容與素材管理<\/h3><p>沿用編輯、圖片上傳、草稿、管理者權限；每站使用各自的內容與素材。<\/p><\/div><div><h3>04 商務與供應商連接<\/h3><p>電商才啟用商品、庫存、訂單與結帳；金流與發票沿用既有模組，每案換帳號參數。<\/p><\/div><div><h3>05 建置與部署工具<\/h3><p>固定版本＋站點設定 → 建環境、初始化、預覽、發布；失敗可定位與重新執行。<\/p><\/div><div><h3>06 維護與更新工具<\/h3><p>沿用版本清單、健康檢查、備份及更新流程；升級前檢查各站相容性。<\/p><\/div><\/div><button onclick=\"openDeliveryProcess(0)\">查看模組如何串成八個交付步驟 →<\/button><p class=\"small\">已存在的功能與新整理的共用工具分開盤點；核心修正能否跨站升級，是複用能否成立的關鍵。<\/p>", "sourceidx": 9, "cls": ""}, {"title": "從萊特模式到正式建站：挑戰與解法", "desc": "以下是需要工程確認的整合工作；已有的金流與發票模組可沿用，重點在接成共同流程。", "body": "<div class=\"research-table\"><table><thead><tr><th>可能挑戰<\/th><th>可能的解法<\/th><th>怎麼確認有解決<\/th><\/tr><\/thead><tbody>\n<tr><td>內容只留在瀏覽器或分享快照<\/td><td>正式資料庫與圖片儲存；登入、草稿、發布版本分開。<\/td><td>換電腦仍可編輯；訪客只看到已發布內容。<\/td><\/tr>\n<tr><td>換模板後，欄位與畫面對不上<\/td><td>統一內容欄位、區塊規格、預設值；設定記錄版本。<\/td><td>兩組品牌資料切換模板，不丟內容、不出現空白區塊。<\/td><\/tr>\n<tr><td>功能組合與交易狀態互相影響<\/td><td>檢查選配相依；統一既有金流／發票模組介面，補回歸測試。<\/td><td>付款成功／失敗／重送、庫存與退款結果正確。<\/td><\/tr>\n<tr><td>客戶資料與權限混用<\/td><td>第一階段評估各站獨立環境與資料庫；每站權限、金鑰分開。<\/td><td>A 站帳號無法讀寫 B 站內容；備份可獨立恢復。<\/td><\/tr>\n<tr><td>網域權限、DNS 與 HTTPS 卡關<\/td><td>先用預覽網址；取得客戶授權後設定 DNS、憑證與正式回呼網址。<\/td><td>正式網域可開啟；信箱設定保留，表單／登入／付款正常。<\/td><\/tr>\n<tr><td>站點越多，更新與成本越難管理<\/td><td>共用核心版本、站點版本清單、自動建置與監控；先測試再逐站升級。<\/td><td>同一核心修正能更新兩站；記錄成本，失敗有回復方式。<\/td><\/tr>\n<\/tbody><\/table><\/div><p class=\"small\"><strong>優先驗證：<\/strong>用同一套核心建立兩個品牌、兩個網址，再更新一次共同模組。看哪些只需改設定，哪些仍要改程式。<\/p><p class=\"footnote\">解法為候選，未代表共用平台已完成。各站獨立部署便於隔離，但仍有主機、備份與升級成本。<\/p>", "sourceidx": 23, "cls": ""}, {"title": "共用核心，如何變成兩個品牌的正式網站？", "desc": "建議先評估：共用程式與模組，各站獨立部署；由我們操作建置工具。", "body": "<div class=\"site-flow\"><div class=\"site-flow-start\"><div><b>① 客戶資料與方案<\/b><small>品牌／文案／圖片／商品<br>模板與功能選配<\/small><\/div><span>＋<\/span><div><b>② 共用核心版本<\/b><small>模板／內容／部署工具<br>電商再加交易與串接模組<\/small><\/div><\/div><div class=\"flow-down\">↓ 驗證必填欄位、模板版本與功能相依 ↓<\/div><div class=\"site-flow-build\"><b>③ 我們執行建置 → 建立預覽 → 客戶確認<\/b><small>自動化建立環境與套用設定；內容確認與功能驗收由人負責<\/small><\/div><div class=\"flow-down\">↓ 分別部署、分別保存客戶資料 ↓<\/div><div class=\"site-flow-sites\"><article><b>④ A 品牌網站<\/b><p>A 站內容／帳號／資料<br>形象站模組<\/p><span>綁定 A 客戶網域 → HTTPS<\/span><\/article><article><b>④ B 品牌網站<\/b><p>B 站內容／帳號／資料<br>共同底座＋電商模組<\/p><span>綁定 B 客戶網域 → HTTPS<\/span><\/article><\/div><div class=\"flow-down\">↓ 正式網址、表單／登入／電商功能確認 ↓<\/div><div class=\"site-flow-maintain\"><b>⑤ 發布與維護<\/b><span>核心修正 → 測試 → 各站逐一升級 → 記錄版本與結果<\/span><\/div><\/div><div class=\"record-actions\"><button onclick=\"openDomainFlow()\">網域怎麼接？點開看<\/button><span class=\"small\">共用程式 ≠ 共用客戶資料；更新程式也不等於回復舊訂單資料。<\/span><\/div>", "sourceidx": 24, "cls": ""}, {"title": "交付提案：以同一份範圍表貫穿全案", "desc": "一種做法：業務、設計、工程與營運沿用同一份範圍表，減少交接落差。", "body": "<div class=\"delivery\"><div><span>01<\/span><h3>需求適配<\/h3><p>客群、目的、標準範圍<\/p><\/div><div><span>02<\/span><h3>範圍報價<\/h3><p>採用表、排除與替代流程<\/p><\/div><div><span>03<\/span><h3>方向確認<\/h3><p>模板、真實素材、流程 Demo<\/p><\/div><div><span>04<\/span><h3>設定建置<\/h3><p>版本、設定、授權與環境<\/p><\/div><div><span>05<\/span><h3>正反向驗收<\/h3><p>成功、失敗、重試與回復<\/p><\/div><div><span>06<\/span><h3>上線移交<\/h3><p>正式證據、帳號與手冊<\/p><\/div><div><span>07<\/span><h3>維運回饋<\/h3><p>支援工時、事件與版本<\/p><\/div><\/div>", "sourceidx": 11, "cls": ""}, {"title": "沿用既有方案，組合設計與電商模組", "desc": "設計已有方案，金流與電子發票已有模組；依客戶需求選用與替換。", "body": "<div class=\"editorial\"><div><h3>設計：沿用既有方案<\/h3><p>從基礎模板到設計師設計，依現有設計方案往上選擇；可配合孝淵的提摩設計。<\/p><\/div><div><h3>金流：替換供應商模組<\/h3><p>依客戶使用的金流商，選用對應的既有模組，設定商家帳號與串接參數。<\/p><\/div><div><h3>電子發票：替換平台模組<\/h3><p>依客戶使用的電子發票平台，選用對應的既有模組，帶入商家資料與開立設定。<\/p><\/div><div><h3>電商價值：我們不抽成<\/h3><p>客戶選模板、設計與功能，由我們建置部署；不抽交易成數，是支撐方案價值與加價的重要賣點。<\/p><\/div><\/div><p class=\"small\">金流、電子發票等第三方服務費依供應商收取；網站建置與維護依既有方案辦理。<\/p>", "sourceidx": 10, "cls": ""}, {"title": "選功能，看價值；做完再記錄投入", "desc": "選擇網站類型、拉動設計深度，再拖入或點選功能；每項可填預估、實際工時與完成日期。", "body": "<div class=\"plan-controls\"><label>網站類型<select id=\"plan-kind\"><option value=\"brand\">純形象網站<\/option><option value=\"shop\">電商網站<\/option><\/select><\/label><label>設計深度：<output id=\"plan-design-label\"><\/output><input id=\"plan-design\" type=\"range\" min=\"0\" max=\"2\" step=\"1\" value=\"0\"><\/label><button onclick=\"plannerReference()\">PDF 參考與組合邏輯<\/button><\/div><div class=\"plan-layout\"><div><h3>可選功能 <small>拖曳或點「加入」<\/small><\/h3><div id=\"plan-library\" class=\"plan-scroll\"><\/div><\/div><div><h3>本次方案 <small>拖入此區<\/small><\/h3><div id=\"plan-selected\" class=\"plan-scroll\"><\/div><\/div><\/div><p id=\"plan-value\" class=\"plan-value\" aria-live=\"polite\"><\/p><p id=\"plan-totals\" class=\"small\" aria-live=\"polite\"><\/p><div class=\"record-actions\"><button onclick=\"exportRecord()\">匯出方案與完成紀錄<\/button><span class=\"footnote\">空白為待填；工時不等於交期。紀錄存於本機瀏覽器，請匯出留存。<\/span><\/div>", "sourceidx": 12, "cls": ""}, {"title": "Medusa 之外，還有哪些技術組合？", "desc": "前台、內容／商務核心、資料庫分層選擇；以下為候選組合，未代表團隊已完成整合。", "body": "<div class=\"research-table\"><table><thead><tr><th>路線／前台<\/th><th>內容或商務核心<\/th><th>資料庫<\/th><th>適用方向與取捨<\/th><\/tr><\/thead><tbody>\n<tr><td>形象站／Astro<\/td><td>結構化內容＋CMS<\/td><td>依 CMS 配置<\/td><td>以內容展示為主；編輯與表單另接。純靜態僅為精簡候選。<\/td><\/tr>\n<tr><td>形象站／Next.js<\/td><td><a href=\"https://payloadcms.com/docs/database/overview\" target=\"_blank\" rel=\"noopener\">Payload CMS<\/a><\/td><td>PostgreSQL 等<\/td><td>編輯、權限與區塊一起整合；需要維護 CMS。<\/td><\/tr>\n<tr><td>電商／Next.js<\/td><td><a href=\"https://docs.medusajs.com/learn/introduction/architecture\" target=\"_blank\" rel=\"noopener\">Medusa<\/a> · 目前基準<\/td><td>PostgreSQL<\/td><td>沿用現有經驗與模組；重點是抽離個案設定。<\/td><\/tr>\n<tr><td>電商／自選前台<\/td><td><a href=\"https://docs.vendure.io/guides/developer-guide/overview/\" target=\"_blank\" rel=\"noopener\">Vendure<\/a><\/td><td>例如 PostgreSQL<\/td><td>另一套商務模型與擴充方式；串接需重新適配。<\/td><\/tr>\n<tr><td>WordPress 主題<\/td><td><a href=\"https://woocommerce.com/document/server-requirements/\" target=\"_blank\" rel=\"noopener\">WooCommerce<\/a><\/td><td>MySQL／MariaDB<\/td><td>主題與外掛生態；要管理相容性、安全更新與維護。<\/td><\/tr>\n<tr><td>Hydrogen／自選前台<\/td><td><a href=\"https://shopify.dev/docs/storefronts/headless/getting-started/build-options\" target=\"_blank\" rel=\"noopener\">Shopify API<\/a><\/td><td>平台管理<\/td><td>減少自管後端；需接受平台費用、API 範圍與限制。<\/td><\/tr>\n<\/tbody><\/table><\/div><p class=\"small\"><strong>討論方式：<\/strong>用同一組品牌與交易需求比較重用比例、串接工時、維護負擔與費用。Medusa 核心仍使用 PostgreSQL；換商務引擎不是只換資料庫。<\/p><p class=\"footnote\">技術比較與對客三方案分開。Shopify 為替代候選，可能有平台交易費；「我們不抽成」只指琢奧不收交易分潤。官方資料查核：2026-09-24。<\/p>", "sourceidx": 20, "cls": ""}, {"title": "市場上有哪些替代方案？值得學什麼？", "desc": "這些是客戶可能比較的建站平台與建置生態；比較功能做法，不以未查證的價格或限制判斷優劣。", "body": "<div class=\"research-table\"><table><thead><tr><th>代表方案<\/th><th>已有能力<\/th><th>我們可以參考<\/th><\/tr><\/thead><tbody>\n<tr><td><a href=\"https://www.wix.com/studio/academy/tutorials/how-to-get-started-in-your-workspace\" target=\"_blank\" rel=\"noopener\">Wix Studio<\/a>／<a href=\"https://help.webflow.com/hc/en-us/articles/33961303934611-Components-overview\" target=\"_blank\" rel=\"noopener\">Webflow<\/a><\/td><td>模板、重用元件、視覺與內容編輯<\/td><td>區塊、品牌樣式與內容分離；預覽與編輯體驗。<\/td><\/tr>\n<tr><td><a href=\"https://shopline.tw/online-store/features\" target=\"_blank\" rel=\"noopener\">SHOPLINE<\/a><\/td><td>主題編輯、金流、發票與超商物流<\/td><td>把在地營運需求整理成商家能理解的功能選項。<\/td><\/tr>\n<tr><td><a href=\"https://www.cyberbiz.io/features/\" target=\"_blank\" rel=\"noopener\">CYBERBIZ<\/a><\/td><td>模組建站、前台調整、訂單與金物流<\/td><td>前台選配要對應後台設定及營運流程。<\/td><\/tr>\n<tr><td><a href=\"https://www.shopify.com/partners/directory\" target=\"_blank\" rel=\"noopener\">Shopify＋建置夥伴<\/a><\/td><td>主題、App、API、設計與整合服務<\/td><td>共用平台能力，再由服務團隊完成品牌與特殊需求。<\/td><\/tr>\n<tr><td><a href=\"https://woocommerce.com/pricing/\" target=\"_blank\" rel=\"noopener\">WooCommerce＋建置商<\/a><\/td><td>WordPress 外掛生態、自選主機；核心不抽營收分潤<\/td><td>分清建置、擴充、主機與維護費用。<\/td><\/tr>\n<\/tbody><\/table><\/div><p class=\"small\">模板、代建置、在地串接與不抽成都有市場先例。我們要比較的是完整服務組合，以及能否穩定反覆交付。<\/p><p class=\"footnote\">官方來源可點各列名稱；查核：2026-09-24。參考做法為本次分析，未進行各平台實機評測。<\/p>", "sourceidx": 21, "cls": ""}, {"title": "我們要做出的差異：可複用核心＋完整交付", "desc": "差異化是這次要建立的能力；需要用實際交付結果確認。", "body": "<div class=\"editorial\"><div><h3>形象站與電商，共同起點<\/h3><p>共用品牌設定、內容後台、模板與發布工具；需要銷售時加入商務核心。驗證：同一品牌能延伸成兩種網站。<\/p><\/div><div><h3>選模板，我們完成部署<\/h3><p>約 10 種模板為方向，搭配內容導入、設定與上線。驗證：第二個品牌主要換資料與設定，記錄實際投入。<\/p><\/div><div><h3>設計與功能分開升級<\/h3><p>可結合孝淵的提摩設計；換視覺仍沿用交易核心。驗證：改設計後，內容與商務流程保持可用。<\/p><\/div><div><h3>不抽成，費用可以說清楚<\/h3><p>建置、設計、選配與維護形成收入；琢奧不抽交易分潤。第三方費用另計，讓客戶看懂長期費用。<\/p><\/div><\/div><div class=\"replica-strip\"><strong>持續累積的資產<\/strong><span>共用模組<\/span><span>設計組合<\/span><span>建置工具<\/span><span>跨站升級能力<\/span><\/div><p class=\"small\">差異不只在功能數量，而在適合客群的組合、在地設定、設計品質與重複交付效率；這些仍需用案例證明。<\/p>", "sourceidx": 22, "cls": ""}, {"title": "評估模組形式，整理啟動要素", "desc": "以萊特為起點，留下可沿用的部分、需要補齊的項目，以及負責人與預計完成時間。", "body": "<div id=\"decisions\" class=\"decision-grid\"><\/div><div class=\"record-actions\"><button class=\"primary\" onclick=\"exportRecord()\">匯出會議紀錄<\/button><span id=\"save-status\" class=\"small\" role=\"status\">尚未修改<\/span><\/div>", "sourceidx": 14, "cls": ""}, {"title": "今天要帶走：可行性判斷與啟動清單", "desc": "其中一個核心目標：一起評估萊特的模組形式，如何延伸到由我們建置部署的網站方案。", "body": "<div class=\"editorial\"><div><h3>形式是否可行？<\/h3><p>資料填寫、模板切換、模組排序與功能選配，哪些能沿用？哪些需要調整？<\/p><\/div><div><h3>啟動還要補什麼？<\/h3><p>整理模板與模組規格、資料保存與權限、既有模組整合、部署工具，以及人力與時間。<\/p><\/div><\/div><p class=\"small\">會後留下：可行性結論、待補項目、負責人與預計完成時間；未確認的部分記錄待驗證方式。<\/p><div class=\"closing-actions\"><button class=\"primary\" onclick=\"go(19)\">整理評估與啟動要素<\/button><button onclick=\"exportRecord()\">匯出紀錄<\/button><button onclick=\"openDetail(15)\">資料來源與限制<\/button><\/div>", "sourceidx": 15, "cls": "closing-slide"}, {"title": "附錄｜164 項清單，可以怎麼用？", "desc": "來源標記與功能完成度，是不同的事。", "body": "<div class=\"provenance\"><div class=\"stack\" aria-label=\"兩案合併72，nova air22，九豆8，新增規劃62\"><div style=\"flex:72;background:oklch(0.7 0.12 155)\">72<\/div><div style=\"flex:22;background:oklch(0.65 0.12 230)\">22<\/div><div style=\"flex:8;background:oklch(0.88 0.06 15)\">8<\/div><div style=\"flex:62;background:oklch(0.68 0.14 35);color:var(--ink)\">62<\/div><\/div><div class=\"legend\"><span>兩案合併<\/span><span>nova air<\/span><span>九豆<\/span><span>新增規劃<\/span><\/div><\/div><div class=\"statement\"><strong>62 項<\/strong><p>原稽核中兩案沒有或不足而補入的規劃，<br>不能當成已完成的共用模組。<\/p><\/div><p class=\"small\">P0：99 項 ／ P1：56 項 ／ P2：9 項。數量不等於工時，也不是套餐分級。<\/p><button onclick=\"go(23)\">探索完整功能清單 →<\/button>", "sourceidx": 2, "cls": ""}, {"title": "三個電商方案：從開店到營運成長", "desc": "依既有 PDF 整理功能層級；標準包含基礎，進階包含標準。", "body": "<div class=\"commerce-tiers\"><article><p class=\"tier-label\">01 ／ 基礎電商<\/p><h3>開始線上銷售<\/h3><p class=\"tier-price\">NT$ 168,000 <small>PDF 參考價<\/small><\/p><ul><li>基礎模板、後台、聯絡表單、SEO／GA4<\/li><li>商品列表／詳情、分類與簡易規格<\/li><li>購物車、結帳、基礎庫存<\/li><li>訂單管理、買家／店家通知<\/li><li>一組金流＋電子發票模組<\/li><li>宅配出貨，手動填單與標記<\/li><\/ul><\/article><article><p class=\"tier-label\">02 ／ 標準電商<\/p><h3>會員經營與促購<\/h3><p class=\"tier-price\">NT$ 208,000 <small>PDF 參考價<\/small><\/p><p class=\"tier-inherit\">基礎全部功能，再增加：<\/p><ul><li>依既有設計方案客製排版<\/li><li>Email／Google／LINE 會員登入<\/li><li>會員中心、訂單查詢與地址管理<\/li><li>多規格 SKU 與各自庫存<\/li><li>折扣碼、滿額優惠、組合價<\/li><li>運費規則、超取／宅配 API、GA4 電商事件<\/li><\/ul><\/article><article><p class=\"tier-label\">03 ／ 進階電商<\/p><h3>品牌設計與數據營運<\/h3><p class=\"tier-price\">NT$ 388,000 <small>PDF 參考價<\/small><\/p><p class=\"tier-inherit\">標準全部功能，再增加：<\/p><ul><li>設計師主視覺與完整網站設計<\/li><li>兩個設計方向，選一深化<\/li><li>Meta Pixel／轉換 API<\/li><li>Google Ads 轉換／再行銷追蹤<\/li><li>Google／Meta 商品目錄 feed<\/li><li>營運儀表板：營收、訂單、商品與會員<\/li><\/ul><\/article><\/div><p class=\"small\"><strong>三案共同：<\/strong>由我們建置部署、不抽交易成數；金流商與電子發票平台可透過既有模組替換。<\/p><p class=\"footnote\">價格為原 PDF 未稅參考值，非本頁新報價。會員分級／點數依需求選配，多店／多倉另案；設計升級亦可依既有方案搭配。第三方費用另計。<\/p>", "sourceidx": 18, "cls": ""}, {"title": "164 項功能的互動附錄", "desc": "原文件可直接閱讀與下載；下表保留 Feature ID，採用決定不等於方案分級。", "body": "<p><button onclick=\"openFeatureDoc(0)\">完整功能文件<\/button> <button onclick=\"openFeatureDoc(1)\">兩案功能對照<\/button> <button onclick=\"openFeatureDoc(2)\">PIMI 範圍文件<\/button><\/p><div class=\"feature-filters\"><label>搜尋<input id=\"feature-search\" type=\"search\" placeholder=\"功能名稱或 ID\"><\/label><label>來源<select id=\"feature-origin\"><option value=\"\">全部來源<\/option><option value=\"merged\">兩案合併<\/option><option value=\"jucheng\">nova air<\/option><option value=\"jiudou\">九豆<\/option><option value=\"added\">新增規劃<\/option><\/select><\/label><label>優先級<select id=\"feature-phase\"><option value=\"\">所有優先級<\/option><option>P0<\/option><option>P1<\/option><option>P2<\/option><\/select><\/label><label>本次決定<select id=\"feature-choice\"><option value=\"\">所有決定<\/option><option>待決策<\/option><option>採用<\/option><option>延後<\/option><option>不適用<\/option><\/select><\/label><\/div><p id=\"feature-count\" class=\"small\" aria-live=\"polite\"><\/p><div class=\"feature-scroll\"><table><thead><tr><th>ID／來源<\/th><th>功能名稱與原要求<\/th><th>本次決定<\/th><\/tr><\/thead><tbody id=\"feature-rows\"><\/tbody><\/table><\/div><div class=\"record-actions\"><button onclick=\"exportRecord()\">匯出目前選擇<\/button><p class=\"footnote\">P0／P1／P2 不等於套餐；延期／排除需在會議紀錄補理由、替代流程與負責人。<\/p><\/div>", "sourceidx": 2, "cls": "appendix"}], "report": [{"title": "電商標準化：一份邀請團隊討論的提案", "lead": "公司內部提案｜2026 年 9 月 24 日｜經驗作為依據，做法待討論", "blocks": [["p", "這次想聊的機會", "九豆與 nova air 累積了電商交易與營運經驗，PIMI 帶來商品客製的思考，萊特試過一鍵套版建頁。把這些經驗放在一起，可以試著做成一種模板化電商服務，想請大家一起看看。"], ["c", "本次主張：結合既有交易經驗與模板建站，採「標準核心＋模板＋選配」的交付方式。客戶選模板與方案，由我們完成建置、驗收與部署。"], ["t", "這次分享希望帶走的四個答案", ["問題", "會議產出"], [["我們累積了什麼？", "知道哪些是已有經驗，哪些只是規格或 Demo。"], ["每次究竟要做什麼？", "建立標準核心、選配模組、個案客製的選擇方法。"], ["模板可以怎麼賣？", "分清專案買斷交付與平台訂閱，選一個小範圍試點。"], ["如何證明值得做？", "用工時、重用率、維護負擔與客戶付費驗證，而非只看生成速度。"]], [0.29, 0.71]], ["p", "閱讀方式", "主線 16 頁，建議提案 20 分鐘、討論 15 分鐘；最後 3 頁是功能數量、物流情境與完整清單的備查附錄。經驗分享用來支持提案，不需逐項講完。"], ["p", "證據標示", "「已核對」指本次讀到的文件或程式；「歷史紀錄」指過去驗證報告；「建議」指本次收斂方向；「待決策」需公司、客戶或供應商確認。未重新測試四案正式營運狀態。"]], "notes": "本次提案的其中一個核心目標，是請團隊評估萊特的模組形式能否延伸到形象網站與電商方案，並整理啟動需要補齊的要素。已做過的是資料套版示範，正式方案的整合仍待團隊評估。討論應留下可沿用部分、待補項目、負責人與預計完成時間。", "refs": "S1-S8"}, {"title": "01｜四個案子，累積的是不同層次的能力", "lead": "品牌畫面可以不同，交易責任與交付方式需要一致。", "blocks": [["t", "案例到可重用資產", ["案例", "核對到的經驗", "可以收斂什麼"], [["九豆", "台灣結帳欄位、組合與活動方案、伺服器購物車、UIC 付款狀態與取消申請。", "把「付款成功之後怎麼成單、退款與處理例外」做成固定流程。"], ["nova air", "Medusa 商務資料集中、營運後台、權限、庫存、物流、內容與舊會員匯入；另有 9 月超商物流報告。", "以清楚的資料責任與營運操作為骨架，供應商串接走統一介面。"], ["PIMI", "目前是 Demo；9 月文件改採 2D 商品底圖疊圖，保存設計位置與尺寸快照；製作規格待校準。", "特殊客製功能要獨立估價；先確認工法與驗收，再選 2D／3D 技術。"], ["萊特", "三種老師頁模板、共用內容區塊、一鍵建立與分享；資料、登入仍為前端示範。", "固定內容模型＋模板渲染器，是快速建站的起點。"]], [0.13, 0.46, 0.41]], ["p", "不能直接推導的結論", "做過某個客戶的功能，不等於已經有可直接安裝的通用套件。可重用前還要去除客戶資料、憑證、商家特規與品牌素材，建立設定介面、版本與驗收。"], ["p", "歷史證據的邊界", "母版稽核以 2026-08-16 為快照。nova air 的 2026-09-04 報告補足後續超商物流進展，但該次「線上付款超取」未刷真卡走完，不能寫成全流程真實交易均已驗證。"]], "notes": "這頁只挑與提案有關的例子。九豆與 nova air 是交易經驗，PIMI 是客製邊界，萊特是套版想像；不需要逐案回顧所有功能。", "refs": "S1、S2、S3、S4、S5"}, {"title": "02｜164 項是需求母版，不是 164 個現成功能", "lead": "本次直接解析 blueprint.yaml：164 項、14 類，包含 62 項新增規劃。", "blocks": [["t", "來源統計：原始標記不是完成度", ["來源標記", "數量", "正確解讀"], [["兩案擇優合併 merged", "72", "需收斂資料、流程與介面，不代表已有統一套件。"], ["nova air 為主要來源 jucheng", "22", "採用該案較適合的方向，仍要逐案驗證。"], ["九豆為主要來源 jiudou", "8", "保留其獨有或較佳能力。"], ["新增規劃 added", "62", "原稽核標為兩案沒有或不足而補入，不能列為既有成果。"]], [0.4, 0.12, 0.48]], ["p", "原母版如何分級", "P0 99 項、P1 56 項、P2 9 項。另有 mandatory 134 項、recommended 21 項、optional 9 項。這些是原母版預設，不能直接對應對外「基礎／標準／進階」售價。"], ["p", "需要修正的使用方法", "原規格把訪客結帳、Email 會員、優惠等都列入較完整的基線；這與服務方案的基礎電商不完全相同。建議加一層「本案採用表」：保留原 ID，但逐案填入採用、延後、不適用、理由、替代作業與驗收人。"], ["c", "新增 62 項 ≈ 37.8% 是來源標記比例，並非「還差 37.8% 才完成」；不同功能的工作量差很多。"], ["p", "一定要拆開的三個欄位", "功能庫是否收錄｜這個專案是否承諾｜實作與驗證到哪個階段。只有三欄分開，業務承諾與工程進度才不會混在一起。"]], "notes": "這是備查頁。有人問功能清單從哪裡來、是否都已完成時再展開；數量不能代替可交付能力。", "refs": "S1；統計由原始 YAML 重新計算"}, {"title": "同一套核心模組，反覆建立不同網站", "lead": "共用程式與模組；每個客戶換品牌、內容、模板與選配設定，由我們建置部署。", "blocks": [["p", "可重用的核心", "模板、內容、網站設定、部署工具是共同底座；電商再加入商品、庫存、購物車、結帳、訂單與供應商模組。"], ["p", "每案不同的部分", "品牌素材、網域、商品與帳號憑證各自獨立。整合為共用核心仍需工程整理與驗證。"]], "notes": "重點是共同模組可以跨客戶反覆使用。不是只複製一個畫面，也不等於所有客戶共享同一份資料庫。", "refs": "本次產品與收費方向；模板數量為規劃，新價格未定案"}, {"title": "04｜每次開案，用三層決定範圍", "lead": "以下是建議的產品範圍；不是已經核准的新報價。", "blocks": [["t", "標準核心、選配模組、個案客製", ["層級", "要做什麼", "如何承諾"], [["共同底線", "後台授權、輸入驗證、資料保存、備份與還原、錯誤紀錄、版本與交付文件。", "有相應風險就要做，不能只因選低價方案而省略。"], ["標準官網核心", "固定區塊、品牌設定、內容管理、聯絡入口、行動版、基本 SEO、發布與回復。", "限定版型、內容量、頁數、修改次數與表單種類。"], ["標準電商核心", "商品、伺服器計價、購物車、結帳、付款核實、訂單、出貨、通知、適用的發票流程。", "限定市場、幣別、金流／發票商與配送模式；含失敗處理。"], ["選配模組", "會員／社群登入、折扣、超商物流、追蹤、匯入、組合商品。", "說明啟用條件、相依模組、可用情境與追加驗收。"], ["個案客製", "PIMI 生產檔與校準、多倉、預約排程、複雜點數、派課薪資。", "先做需求與風險評估，再獨立估工報價。"]], [0.22, 0.42, 0.36]], ["p", "選擇順序", "先問賣什麼、怎麼收款、怎麼交付、誰日常操作、錯誤怎麼補救；再選功能。最後才選頁面與版型。"], ["c", "可以先人工處理退款或物流，但要有可追溯的作業流程、負責人與對帳。省下自動化，不代表取消營運責任。"], ["p", "進階與設計合作", "進階方案沿用既有核心，限定頁面、區塊與設計延伸；可與孝淵的提摩設計配合客製視覺。新交易規則與跨系統串接仍另案估工，合作範圍與責任需確認。"]], "notes": "先提出一個可討論的界線：固定核心、選配和另案客製。問大家哪些常見需求放錯了層、哪些限制客戶可能不接受。", "refs": "S1、S4、S8；三層拆分為本次建議"}, {"title": "05｜把「有這個功能」改成可驗收的承諾", "lead": "售前談情境，規格寫邊界，驗收看結果。", "blocks": [["t", "功能選擇的示範決策", ["需求", "首版建議", "要問清楚"], [["顧客購買一般現貨", "一種付款商＋一種宅配流程；安全結帳與訂單追蹤必備。", "付款方式、出貨人、取消退款、發票作業、商家帳號是否就緒？"], ["希望經營會員", "按需求加入會員與一種登入方式；沒有會員也需安全查單方案。", "顧客非登入不可買嗎？社群帳號如何綁定？忘記密碼怎麼辦？"], ["要超商取貨", "線上付款超取、取貨付款分開定義與驗收。", "選店在哪發生？何時算已付？未取如何處理？誰列印寄件單？"], ["要客製商品", "獨立設計快照、人工審稿、製作狀態與供應商確認。", "何時鎖稿？如何計價？哪份檔案給工廠？不合格怎麼退回？"], ["要快速生成官網", "只開放已驗證模板、內容欄位與品牌設定。", "哪些區塊可改？誰審稿？是否獨立網域？要不要交出原始碼？"]], [0.26, 0.38, 0.36]], ["p", "一張功能決策卡", "例 PAY-005：付款通知重複送達。原因：供應商會重試；承諾：同一付款不重複成單、扣庫存或開票；驗收：連續與同時重放通知，結果只有一次；失敗：保存記錄並可重試；負責：工程／營運。"], ["p", "避免用術語取得假共識", "Webhook＝第三方主動回報；冪等＝重送也只做一次；SKU＝可獨立定價／管庫存的款式；Adapter＝把不同廠商的接口翻成公司共用格式。"]], "notes": "這頁是備查例子。若大家對功能邊界沒有共識，再用超取說明：同一名稱可能有不同交易責任。", "refs": "S1、S3、S4；選擇示範非客戶已確認需求"}, {"title": "06｜萊特：實作原理與後續延伸", "lead": "本次重新核對原專案的管理頁、teacher-storage 與老師公開頁。", "blocks": [["p", "建立流程", "admin/page.tsx 的 handleCreate 呼叫 buildDefaultTeacher，依姓名、聯絡資料及模板建立 Teacher 物件；addStoredTeacher 將資料保存於 localStorage，並提供短網址與帶 d 參數的分享網址。"], ["p", "呈現流程", "teacher/[id]/page.tsx 優先讀取並解碼網址的 d 資料，快取到本機；否則查靜態樣本或本機資料。以 teacher.template 決定 A／B／C 的樣式與區塊呈現。同一套程式渲染不同資料，沒有逐人部署。"], ["p", "為何能一鍵", "輸入欄位、預設資料與版型已事先定義；按鈕只要組資料、保存並產生連結。這是固定模型的套版，不是每次產生任意程式。"], ["p", "現況界線", "localStorage 不提供中央同步；編碼網址是資料快照而非加密。登入與部分編輯／保存仍有示範限制，一鍵生成不代表新帳號與正式發布已完整成立。"], ["p", "形象站延伸", "加入真正的登入與站點權限，資料庫保存內容，素材放物件儲存，建立草稿、預覽、發布版本與回復。內容後台、多語和表單按方案選配。"], ["p", "電商延伸", "保留內容與模板分離，另外接商務核心管理商品、計價、付款、訂單與庫存；前端設定不能決定付款或授權結果。串接、回報去重、退款與對帳需驗收。"], ["c", "頁籤「現場操作」是簡報重製示範；「現在怎麼做」來自原專案靜態程式核對；「之後怎麼延伸」是提案。"]], "notes": "本次提案的其中一個核心目標，是請團隊評估萊特的模組形式能否延伸到形象網站與電商方案，並整理啟動需要補齊的要素。已做過的是資料套版示範，正式方案的整合仍待團隊評估。討論應留下可沿用部分、待補項目、負責人與預計完成時間。", "refs": "S5-S7；原專案 app/admin/page.tsx:284、lib/teacher-storage.ts:83、app/teacher/[id]/page.tsx:29；靜態程式核對，延伸為提案"}, {"title": "07｜客戶選模板，我們建置與部署", "lead": "各種方案都由我們完成網站建置與部署，後續維護另定範圍。", "blocks": [["p", "客戶選擇", "從純形象站、電商與進階方案中選模板與功能；我們協助確認標配、選配及客製範圍。"], ["p", "我們交付", "導入內容、設定功能、配置環境與網域，完成驗收並部署可使用的網站。"], ["p", "費用界線", "報價列明模板方案、內容導入、功能選配、部署，以及另外約定的維護服務。主機、網域與第三方費用的付款和帳號歸屬也需說明。"], ["p", "後續維護", "定義更新、備份、內容調整、故障處理與回應責任；新增功能或新流程另外估價。"], ["p", "成果與共用核心", "客戶內容、專屬設計、可重用核心與第三方素材的權利，依合約分清楚。"]], "notes": "明確說：我們賣的是選定模板與方案後，由我們建置和部署完成的網站。討論的是方案包含什麼，以及後續維護怎麼約定。", "refs": "使用者確認的交付模式；S8 為既有報價參考，實際費用與責任另定"}, {"title": "08｜初步做法，請大家幫忙看看", "lead": "以下是供團隊討論的技術草圖；工具具備相關能力，不代表整體做法已驗證。", "blocks": [["p", "純形象網站架構", "固定品牌內容採靜態頁或 Next.js 與網站託管；不需要 Medusa、交易資料庫與金流。內容後台、文章、多語、聯絡表單為選配；表單需配置伺服器端送信服務與送達驗收。頁數、素材量、修改次數與維護責任需約定。"], ["p", "設定層", "以 ShopConfig 保存品牌、template_version、schema_version、區塊與選配白名單。固定模板元件讀取設定與商務 API，使樣式變動不必重寫交易邏輯。"], ["p", "交易層", "沿用 Medusa v2 與 PostgreSQL 管理商務資料；金流、發票與物流透過 Adapter 封裝。官方支援可重用模組；包含 API 與 workflows 的整套擴充則可考慮 plugin 封裝。"], ["p", "建置層", "腳本依固定版本建立獨立商家環境、初始化資料、設定憑證及執行健康檢查；建立工作需可追蹤、可重試並避免重複副作用。這段自動化尚待實作。"], ["p", "選擇與代價", "先每商家獨立部署與資料庫、共用版本，隔離較直觀但有每站成本與批次升級負擔。多租戶平台可集中管理，但權限、檔案、快取、背景工作都要隔離，暫不作首版前提。"], ["c", "這個方向看起來有機會減少重複設定與畫面工程，但能省多少、整合有多難，還需要一起評估和實測。付款、庫存、退款與對帳的正確性仍是必要條件。"]], "notes": "可以這樣說：「我先把可能的做法整理成設定、交易和建置三塊。這不是定案架構，想請工程幫忙看哪些沿用得上、哪些想得太簡單；也請設計和業務看看限制能不能接受。」", "refs": "S1、S5-S7；https://docs.medusajs.com/learn/fundamentals/modules；https://nextjs.org/docs/app/getting-started/server-and-client-components；架構為提案"}, {"title": "建站系統本身，也要有可重用的模組", "lead": "把每案反覆做的工作做成內部工具；輸入客戶設定，組合網站，再由我們部署。", "blocks": [["t", "01 選方案｜確認模板、方案與追加範圍", ["欄位", "具體內容"], [["負責人", "PM／業務＋客戶"], ["需要的資料", "客戶用途、預計頁面、商品種類、參考風格與預算範圍。"], ["具體操作", "從規劃模板庫選版；逐項勾選標配、選配、設計升級。新流程與串接列入客製報價。"], ["交付結果", "方案確認單：模板 ID、頁面清單、模組清單、修改次數、費用與排除項目。"], ["通過條件", "客戶確認範圍與報價；未確認的功能不能直接進入建置。"], ["方案差異／注意", "形象站確認內容與聯絡；電商另確認市場、幣別、收款、配送與發票需求。"]], [0.2, 0.8]], ["t", "02 收資料｜把素材與商家資料收齊", ["欄位", "具體內容"], [["負責人", "PM 收件；客戶提供；設計檢查素材"], ["需要的資料", "Logo、品牌色、文案、圖片、聯絡資訊、網域管理窗口；電商另交商品表。"], ["具體操作", "檢查圖片尺寸與使用權、文案缺漏；商品表核對 SKU、規格、售價、庫存與運費。列缺件清單。"], ["交付結果", "素材資料夾＋結構化內容表。商品例：SKU T001／白色 M／售價／可售庫存。"], ["通過條件", "缺件有負責人與補件日；示意文字或圖片需明標，不能當成正式內容。"], ["方案差異／注意", "電商此時同步申請金流、物流、發票帳號；憑證走安全管道，不放內容表。"]], [0.2, 0.8]], ["t", "03 建設定｜把選擇轉成可建置的設定", ["欄位", "具體內容"], [["負責人", "工程＋PM；設計升級由設計師提供稿件"], ["需要的資料", "已確認的模板、內容表、功能清單與設計稿。"], ["具體操作", "建立 site_id、template_id、template_version、啟用模組與內容設定；檢查相依條件。設計超出既有區塊需先估工。"], ["交付結果", "一份版本化建站設定。例如：brand-a／T03／v1／形象站＋聯絡表單。"], ["通過條件", "必填欄位、模板版本與模組組合通過檢查；不支援的設定退回確認。"], ["方案差異／注意", "形象站不啟用交易核心；電商設定指定金流與配送模式，金鑰不寫入前端設定。"]], [0.2, 0.8]], ["t", "04 建測試站｜由我們執行建立流程", ["欄位", "具體內容"], [["負責人", "工程執行；PM 追蹤建置狀態"], ["需要的資料", "已驗證設定、固定程式版本、部署帳號與測試環境權限。"], ["具體操作", "啟動建立工作：準備環境 → 配置儲存 → 初始化內容 → 套模板 → 部署測試網址。每步記錄結果；失敗重試不重複建站。"], ["交付結果", "可開啟的測試網址＋建置紀錄：站點 ID、程式／模板版本、成功或失敗步驟。"], ["通過條件", "測試站可正常載入；失敗要定位到步驟並修復，不能略過錯誤標成完成。"], ["方案差異／注意", "形象站可用靜態託管；有內容後台再配資料服務。電商另建商務服務、資料庫與測試金流。"]], [0.2, 0.8]], ["t", "05 確認預覽｜用真實素材確認畫面與內容", ["欄位", "具體內容"], [["負責人", "客戶確認；設計調整；PM 管理回饋"], ["需要的資料", "測試網址、已導入素材與約定的頁面清單。"], ["具體操作", "逐頁檢查桌面／手機、字圖、導覽與聯絡入口。回饋集中成一張修改單，按約定輪次修正。"], ["交付結果", "客戶確認的預覽版本＋修改完成清單；超出方案的要求另列變更單。"], ["通過條件", "已約定頁面與內容確認；未完成事項列清楚，不以口頭「差不多」代替。"], ["方案差異／注意", "電商加查商品規格、圖片、價格與運費顯示；此步確認畫面，不代表付款驗收完成。"]], [0.2, 0.8]], ["t", "06 功能驗收｜留下成功與失敗情境的證據", ["欄位", "具體內容"], [["負責人", "工程測試＋PM 驗收；客戶提供正式商家條件"], ["需要的資料", "驗收清單、測試帳號；電商另需可用供應商帳號與回報設定。"], ["具體操作", "形象站測連結、手機版、SEO 與選配表單送達。電商測付款成功／失敗、重送回報、最後一件庫存、退款及配送。"], ["交付結果", "逐項結果與證據：操作紀錄、訂單 ID、付款／庫存狀態；問題清單有主責。"], ["通過條件", "阻斷問題排除；測試環境結果與正式小額驗證分開記錄，不能只看成功畫面。"], ["方案差異／注意", "正式交易驗證安排於受控上線時段，依商家同意的金額與流程執行；尚未完成就保留待驗證。"]], [0.2, 0.8]], ["t", "07 正式上線｜切換網域並驗證正式版本", ["欄位", "具體內容"], [["負責人", "工程部署；PM 協調；客戶授權網域與正式帳號"], ["需要的資料", "確認版本、DNS 管理權、正式環境設定、備份與回復計畫。"], ["具體操作", "依約定時段部署 → 設網域與 HTTPS → 驗公開頁與表單 → 電商驗正式付款及回報。記下版本、時間與檢查結果。"], ["交付結果", "正式網址＋上線核對表＋實際部署版本；正式驗證未過就暫停收單或回復相容版本。"], ["通過條件", "HTTPS、主要頁面、通知及所選功能可用；電商完成正式交易與對帳檢查後才開放營運。"], ["方案差異／注意", "可回復程式或發布版本；有新訂單後不能直接還原舊交易資料，需另做相容遷移或修復。"]], [0.2, 0.8]], ["t", "08 移交維護｜交清楚帳號、責任與後續服務", ["欄位", "具體內容"], [["負責人", "PM 移交；工程維運；客戶指定操作人"], ["需要的資料", "正式版本、帳號清單、操作文件、維護合約與聯絡窗口。"], ["具體操作", "教客戶更新內容或處理訂單；說明誰付主機／網域／第三方費用，安排備份、監控與更新。"], ["交付結果", "操作手冊＋帳號權限清單＋維護範圍、回應約定與版本紀錄。"], ["通過條件", "客戶能完成基本操作；維護窗口、備份位置與恢復方式有人負責。"], ["方案差異／注意", "電商不抽交易成數；建置、設計、功能選配、維護與第三方費用依約計收。"]], [0.2, 0.8]]], "notes": "先講需要重用的六種系統能力，再用按鈕查看原八步交付流程。既有交易與供應商模組是起點；共用設定、模板登錄、自動建置和跨站升級是待整理的工程工作。", "refs": "本次交付流程規劃；S5-S7 提供資料套版經驗，工程自動化與責任分工待落實"}, {"title": "10｜沿用既有方案，組合設計與電商模組", "lead": "設計已有方案，金流商與電子發票平台均有既有模組可選用替換。", "blocks": [["p", "設計方案", "沿用現有的基礎模板與設計師設計方案，依方案遞進；設計配合可結合孝淵的提摩設計。"], ["p", "金流供應商", "依客戶採用的金流商切換對應的既有模組，設定商家帳號與串接參數。"], ["p", "電子發票平台", "依客戶採用的平台選用對應的既有模組，帶入商家資料與開立設定。"], ["p", "部署與價值", "客戶選方案、設計與功能，由我們完成建置部署。電商不抽交易成數，作為方案價值與加價的重要賣點。"], ["p", "費用", "網站建置與 se": "P0", "requirement": "mandatory", "origin": "added", "name": "個資告知、同意、最小蒐集與目的限制"}, {"id": "SEC-011", "phase": "P1", "requirement": "mandatory", "origin": "added", "name": "個資保存、匿名化、匯出、刪除與法定留存"}, {"id": "SEC-012", "phase": "P0", "requirement": "mandatory", "origin": "added", "name": "Secrets 輪替、金鑰分環境與敏感資訊遮罩"}, {"id": "SEC-013", "phase": "P1", "requirement": "mandatory", "origin": "added", "name": "相依套件、SAST、秘密掃描與修補 SLA"}, {"id": "QLT-001", "phase": "P0", "requirement": "mandatory", "origin": "added", "name": "WCAG 2.2 AA 與鍵盤/讀屏驗收"}, {"id": "QLT-002", "phase": "P0", "requirement": "mandatory", "origin": "merged", "name": "320px 至桌面 RWD、safe area 與無橫向溢出"}, {"id": "QLT-003", "phase": "P0", "requirement": "mandatory", "origin": "added", "name": "Core Web Vitals、圖片與 JavaScript 預算"}, {"id": "QLT-004", "phase": "P0", "requirement": "mandatory", "origin": "added", "name": "單元、契約、整合、E2E 與人工測試分層"}, {"id": "QLT-005", "phase": "P0", "requirement": "mandatory", "origin": "merged", "name": "付款、webhook、庫存、退款與權限競態測試"}, {"id": "QLT-006", "phase": "P0", "requirement": "mandatory", "origin": "added", "name": "Dev、Preview、Staging、Production 隔離"}, {"id": "QLT-007", "phase": "P0", "requirement": "mandatory", "origin": "added", "name": "Migration 前向/回滾、備份與還原演練"}, {"id": "QLT-008", "phase": "P0", "requirement": "mandatory", "origin": "added", "name": "結構化日誌、錯誤追蹤、指標與告警"}, {"id": "QLT-009", "phase": "P0", "requirement": "mandatory", "origin": "added", "name": "CI 品質門檻、建置產物與供應鏈檢查"}, {"id": "QLT-010", "phase": "P0", "requirement": "mandatory", "origin": "merged", "name": "部署後 smoke、版本證據、回滾與功能旗標"}, {"id": "QLT-011", "phase": "P0", "requirement": "mandatory", "origin": "added", "name": "不得用正式訂單、庫存或金流做破壞性測試"}, {"id": "QLT-012", "phase": "P0", "requirement": "mandatory", "origin": "added", "name": "台灣網路交易揭露與契約逐項覆核"}, {"id": "QLT-013", "phase": "P1", "requirement": "mandatory", "origin": "added", "name": "SEO、結構化資料、連結與索引 QA"}, {"id": "QLT-014", "phase": "P0", "requirement": "mandatory", "origin": "added", "name": "每個 Feature ID 至少一個驗收證據"}], "sourceDocs": [{"name": "ECOMMERCE-MASTER-SPEC.md", "title": "完整功能與驗收規格", "raw": "# 台灣品牌型電商 AI 單一需求規格\n\n版本：2026-08-16  \n適用：台灣單一品牌、單一商家、繁體中文、TWD 的 B2C 實體商品電商  \n搭配文件：[`AI-BUILD-GUIDE.md`](AI-BUILD-GUIDE.md)\n\n本文件是交給 AI 或工程團隊的單一功能與驗收依據。新案可以替換品牌視覺與 provider，但不得因此省略商務狀態、安全邊界、錯誤復原及驗收條件。\n\n若某功能不適用：\n\n- P0 原則上不得排除；排除前必須說明替代流程、風險、owner 與簽核。\n- P1 為標準完整版預設交付；只有明確不適用時才能標記 `N/A`。\n- P2 依商業需求啟用；未啟用仍保留 Feature ID。\n\n所有功能狀態只能使用：`not_started`、`in_progress`、`implemented`、`verified`、`blocked`、`N/A`。只有附可重跑證據才能標成 `verified`。\n\n---\n\n## 1. 固定技術與資料邊界\n\n| 層 | 母版決策 |\n|---|---|\n| 前台與自訂後台 | Next.js App Router、React、TypeScript；依現有品牌視覺換皮 |\n| 商務核心 | Medusa v2，承擔商品、價格、購物車、訂單、庫存與促銷生命週期 |\n| 永久資料 | PostgreSQL 是唯一商務資料來源；禁止跨 Medusa/Supabase/自建表雙寫 |\n| 快取與背景工作 | Redis，用於 cache、lock、rate limit、job；不可當永久訂單總帳 |\n| 媒體 | S3 相容 object storage + CDN；不可依賴 ephemeral filesystem |\n| 外部服務 | Payment、Invoice、Fulfillment、OAuth、Email 都以 provider adapter 隔離 |\n| 付款資料 | 使用第三方託管付款頁；本站不接觸或記錄完整卡號 |\n| 分析 | 先取得 consent 才載入非必要分析或行銷工具 |\n\n### 硬性規則\n\n- 商品、Variant、價格、庫存、購物車、訂單與付款狀態只能各有一個權威寫入來源。\n- Client 傳來的金額、折扣、庫存、角色、會員 ID、訂單所有權與付款結果一律不可信。\n- 付款成功以簽章 webhook 或主動查詢確認；return URL 只顯示結果，不直接改狀態。\n- 外部回呼、重試、按鈕雙擊、job 重跑與人工補跑都必須冪等。\n- 訂單保存商品、價格、地址、發票、超商與組合內容快照，來源資料後改不得改寫歷史訂單。\n- Payment、Order、Fulfillment、Return、Invoice 分開保存狀態，不建立互相矛盾的單一萬用 status。\n- 所有 Admin page、Server Action、Route Handler、Commerce Admin API 都重新驗證 session 與 permission；UI 隱藏不算授權。\n- 所有正式外部操作、正式資料 migration、部署、DNS、真實請退款與發票動作需要明確授權。\n\n---\n\n## 2. 品牌視覺契約\n\nAI 必須先從現有 repo、設計稿或網站抽取並沿用：\n\n- Logo、安全留白、品牌色與語意色。\n- display/body 字體、字級比例與 fallback。\n- 容器寬度、grid、間距、圓角、邊框、陰影與圖片比例。\n- Header、Footer、Button、Input、Card、Badge、Dialog、Drawer、Toast、Table 等元件語言。\n- breakpoint、手機導覽、sticky CTA、safe area 與互動動效。\n\n可以改版面細節，但每個互動元件都必須有 default、hover/focus、active、disabled/loading、error 狀態；所有可點目標至少 44×44 CSS px，支援 keyboard、screen reader、200% zoom 與 `prefers-reduced-motion`。\n\n至少驗證 320×568、375×812、390×844、768×1024、1280×800、1440×900。整頁不可橫向溢出，長中文、Email、SKU、四位以上金額、空資料及錯誤資料不得破版。\n\n---\n\n## 3. 必備頁面與營運介面\n\n### 顧客前台\n\n- 首頁、公告、活動 Landing、商品列表、分類/集合、搜尋、商品詳情。\n- 購物車 drawer、完整購物車、結帳、付款導向、付款結果。\n- 關於、品牌故事、技術/特色、FAQ、客服、文章列表與文章詳情。\n- 隱私權、服務條款、退換貨政策、交易安全與 404。\n\n### 身分與會員\n\n- 註冊、登入、Email 驗證、忘記/重設密碼、可選 Google/LINE。\n- 會員資料、地址簿、常用超商、偏好與行銷同意。\n- 訂單列表、訂單詳情、物流追蹤、取消申請、退貨申請、資料匯出/刪除入口。\n\n### 營運後台\n\n- Dashboard 與營運待辦。\n- 商品、Variant、分類、集合、媒體、組合、價格與促銷。\n- 訂單、付款、發票、取消、退款、履約、物流、標籤與退貨 RMA。\n- 庫存、異動、低庫存、盤點與庫位。\n- 會員、標籤、客服備註、舊資料匯入。\n- 首頁內容、Banner、品牌頁、FAQ、法務、文章與活動。\n- 員工、角色、模組權限、MFA、Audit log、報表與系統狀態。\n\n每頁都要有 loading、empty、error、permission denied 與 mutation failure 狀態；高風險操作顯示影響摘要、原因、二次確認，必要時重新驗證身分。\n\n---\n\n## 4. 核心資料模型\n\n實作可以沿用 Medusa 原生模型或等價 extension，但下列概念、關聯與約束不可消失：\n\n| 資料域 | 必備實體 |\n|---|---|\n| 品牌與身分 | BrandConfig、Customer、CustomerIdentity、Address、PickupStorePreference、AdminUser、Role、Permission |\n| 商品與內容 | Product、ProductVariant、ProductOption、Category、Collection、Tag、MediaAsset、BundleComponent、ContentEntry、Article、Campaign |\n| 價格與庫存 | Price、Promotion、PromotionRedemption、InventoryItem、StockLocation、InventoryLevel、InventoryMovement、Reservation |\n| 交易 | Cart、CartLine、CheckoutSession、Order、OrderLine、OrderAddressSnapshot |\n| 金流與發票 | PaymentAttempt、PaymentTransaction、Invoice |\n| 履約與售後 | Fulfillment、Shipment、CancelRequest、ReturnRequest、ReturnLine、Refund |\n| 營運與可靠性 | ConsentRecord、NotificationDelivery、AuditLog、WebhookReceipt、IdempotencyRecord、OutboxEvent |\n\n主要 invariant：\n\n- SKU 與條碼依商家規則唯一；每個可販售 Variant 對應唯一庫存項目。\n- `available = stocked - reserved`；扣庫、保留、釋放與 rollback 原子化，併發不得超賣。\n- 金額以 TWD 整數保存；折扣、運費、稅、退款分攤使用同一 rounding 規則。\n- Cart confirm 時重新讀取價格、優惠、販售期間、庫存與配送資格，差異需顯示並由使用者重新確認。\n- Webhook 以 provider + event ID 或等價鍵去重；Idempotency key 的相同請求只能產生一次副作用。\n- Audit log、Inventory movement、Payment transaction 與 webhook receipt 採 append-only 語意並遮罩敏感資料。\n- 個資保存期限、刪除、匿名化、legal hold、備份還原後重新刪除都有可驗流程。\n\n---\n\n## 5. 交易與逆向流程\n\n### 正向流程\n\n`Cart → Checkout review → Pending payment → Authorized/Captured → Invoice issued → Processing → Shipped → Delivered`\n\n- 建立訂單與付款嘗試必須有 idempotency key。\n- captured event 觸發開票、通知與可履約狀態；附屬服務失敗不回滾已完成付款，而是建立待辦、重試與告警。\n- pending、failed、expired、cancelled、authorized、captured、partially_refunded、refunded 必須清楚區分。\n\n### 取消與逾期\n\n- 顧客只能在政策允許且未出貨時申請取消；同訂單同時只能有一個 pending request。\n- 管理員核准後依付款狀態 void/refund，釋放或回補庫存，處理發票作廢/折讓並通知。\n- 逾期 job 只能取消仍未付款、未請款、未履約的候選訂單；可安全重跑與停用。\n\n### 退貨與退款\n\n`Delivered → Return requested → Approved → Received → Inspected → Restocked/Rejected → Refunded → Invoice allowance/void`\n\n- 支援部分品項與部分數量，所有 line quantity 與金額分攤維持一致。\n- 收件、驗貨、回庫、退款及發票處理可分段失敗後續跑，不得靠單一長 transaction 呼叫多個外部服務。\n\n---\n\n## 6. API、事件與 provider 契約\n\n至少要有下列介面族群；實際 URL 可配合現有專案，但責任不可混淆：\n\n- Public/CMS：首頁、品牌頁、FAQ、法務、文章、活動、metadata、sitemap。\n- Catalog：商品、Variant、分類、集合、搜尋、篩選、庫存可售投影。\n- Cart/Checkout：建立/讀取/合併 cart、line mutation、promotion、shipping、pickup store、invoice、review、confirm。\n- Identity/Member：register/login/logout/verify/reset/OAuth link、profile、address、orders、cancel、return、privacy requests。\n- Admin：catalog、content、pricing、inventory、orders、payments、invoice、fulfillment、returns、members、staff、permissions、audit、reports。\n- Webhooks：payment、invoice、carrier；驗 raw body 簽章、時間窗、來源與 replay。\n- Events：order placed、payment authorized/captured/failed/refunded、invoice issued/failed、fulfillment created/shipped/delivered、return transitions、stock low、notification failed。\n\nProvider adapter 至少實作：\n\n- `PaymentProvider`：create、authorize/capture、void、refund、query、verifyWebhook、normalizeStatus。\n- `InvoiceProvider`：issue、void、allowance、reissue、query。\n- `FulfillmentProvider`：quote/validate、createShipment、cancelShipment、label、tracking、verifyWebhook。\n- `IdentityProvider`：startOAuth、verifyCallback、link/unlink，且只有設定完整時顯示入口。\n\n每個 adapter 都先以 deterministic fake 跑相同 contract suite，再接 sandbox；測 success、pending、fail、timeout、duplicate、out-of-order、unknown outcome。\n\n---\n\n## 7. 實作優先級索引\n\n- **P0 核心上線：99 項。** 缺少即不得接受真實訂單。\n- **P1 標準完整版：56 項。** 母版預設全部交付。\n- **P2 成長模組：9 項。** 按案啟用。\n\nP2 IDs：`CAT-013`、`CAT-014`、`PRC-008`、`PRC-009`、`ORD-011`、`FUL-009`、`INV-010`、`MKT-010`、`MKT-011`。除這九項外皆屬 P0 或 P1，預設必須交付或留下正式 N/A 決策。\n\n---\n\n## 8. 全功能驗收清單（164 項）\n\n勾選前要附 command、test report、log、requestId、screenshot、錄影或 sandbox reference 等可重跑證據。只有畫面或單一 happy path 不算完成。\n\n### FND 平台與共用基礎\n\n- [ ] `FND-001` — 前台、後台、BFF、Commerce API 的 token/責任邊界經架構與 request 測試證明。\n- [ ] `FND-002` — 商品、cart、order、inventory 只有一個權威寫入來源，無雙寫 path。\n- [ ] `FND-003` — 品牌/Feature flag 有 schema、預設、Admin API 二次檢查與排除紀錄。\n- [ ] `FND-004` — 缺少/矛盾 env 啟動即 fail；secrets 不出現在 client/log/repo。\n- [ ] `FND-005` — Redis 斷線的快取/鎖/job 行為安全且可觀測。\n- [ ] `FND-006` — outbox 重播不重做副作用；dead-letter 可查與補跑。\n- [ ] `FND-007` — liveness/readiness 能區分 DB/Redis/provider degraded，health 無副作用。\n- [ ] `FND-008` — TWD、Asia/Taipei 顯示/UTC 儲存、語系與稅設定集中且測日期邊界。\n\n### CNT 內容與曝光\n\n- [ ] `CNT-001` — 首頁區塊由 CMS/config 組裝，壞資料不使全頁失敗。\n- [ ] `CNT-002` — 公告/Banner/Promo 新增、排序、啟停、起訖與過期行為皆驗。\n- [ ] `CNT-003` — 品牌內頁/FAQ 可編輯、預覽、發布且保有必要 fallback。\n- [ ] `CNT-004` — 文章 CRUD、slug、分類、推薦、draft/publish/archive 與 404 權限通過。\n- [ ] `CNT-005` — 四類法務頁有版本/生效日且 checkout 留存同意版本。\n- [ ] `CNT-006` — 圖片 MIME/大小/像素/壓縮/排序/替換失敗/alt 都有驗收。\n- [ ] `CNT-007` — media 跨部署持久；孤兒檔清理不刪仍被引用檔。\n- [ ] `CNT-008` — 每個 indexable page 有正確 title/description/canonical/OG/share image。\n- [ ] `CNT-009` — robots/sitemap/404/redirect 與 apex/www canonical 皆自動測。\n- [ ] `CNT-010` — Product/Offer/Organization/Breadcrumb JSON-LD 與可見價格庫存一致。\n- [ ] `CNT-011` — 搜尋支援輸入、清除、無結果建議、超時降級與 rate limit。\n- [ ] `CNT-012` — draft preview 不可被索引/猜 URL 讀取；版本衝突與發布 audit 可見。\n\n### CAT 商品目錄\n\n- [ ] `CAT-001` — Product create/update/publish/archive/delete 各自限制與歷史訂單不變。\n- [ ] `CAT-002` — Category/Collection/Tag 關聯、排序、刪除與空分類行為通過。\n- [ ] `CAT-003` — 多 Option/Variant、唯一 SKU/Barcode、組合合法性與 URL 選擇可驗。\n- [ ] `CAT-004` — list/sale price、badge/status 時段與 TWD 顯示/計算一致。\n- [ ] `CAT-005` — gallery/長圖/features/spec/content sections 手機、alt、壞資料通過。\n- [ ] `CAT-006` — bundle/盒數/混搭快照、價錢、庫存、訂單/信件顯示一致。\n- [ ] `CAT-007` — Variant 未開始/已結束/disabled/free shipping 在 PDP/cart/checkout 同步。\n- [ ] `CAT-008` — PLP/PDP/分類/排序/分頁與 draft/archived 404 正確。\n- [ ] `CAT-009` — price/stock/attribute filters 可分享、換條件清 cursor、無結果清楚。\n- [ ] `CAT-010` — Admin 變更後下一個 public request 讀新版，無全站不必要 purge。\n- [ ] `CAT-011` — 首頁/文章/相關商品只顯示可公開可購買項並有 fallback。\n- [ ] `CAT-012` — import preview/commit/export 含欄位 mapping、invalid row、idempotency、安全 CSV。\n- [ ] `CAT-013` — 評論啟用時驗購/審核/檢舉/平均分與結構化資料防造假。\n- [ ] `CAT-014` — 通知/預購啟用時資格、同意、去重、庫存到貨與取消訂閱通過。\n\n### CRT 購物車與結帳\n\n- [ ] `CRT-001` — server cart 重新整理/跨裝置策略與不可偽造 cart token 通過。\n- [ ] `CRT-002` — add/update/remove/clear、0/負數/99+/重複 Variant 邊界通過。\n- [ ] `CRT-003` — 匿名→登入 merge 有 quantity/invalid/price conflict 摘要且不遺失合法 line。\n- [ ] `CRT-004` — drawer/full cart 同一 server projection，手機/鍵盤/讀屏可操作。\n- [ ] `CRT-005` — confirm 前重新驗 price/promo/sale/stock，差異不靜默。\n- [ ] `CRT-006` — expired/abandoned 狀態釋放 reservation、可復原政策與事件去重。\n- [ ] `CRT-007` — Email/手機/郵遞區號/縣市區域/地址錯誤與 autocomplete 通過。\n- [ ] `CRT-008` — 宅配/超商/門市切換清除不適用欄位，門市資料 server 驗證。\n- [ ] `CRT-009` — 固定/滿額/商品免運在 cart、checkout、order snapshot 相同。\n- [ ] `CRT-010` — 折扣套用/移除/過期/不適用/達上限/大小寫/競態通過。\n- [ ] `CRT-011` — 訂單備註與配送備註分欄、長度/清理、後台/出貨單可見。\n- [ ] `CRT-012` — 個人/公司/載具/捐贈欄位互斥與格式、order/invoice snapshot 通過。\n- [ ] `CRT-013` — guest 能下單、查訂單與選擇註冊；不強迫建立重複帳號。\n- [ ] `CRT-014` — address book/常用超商 CRUD、default 唯一與訂單快照不回寫。\n- [ ] `CRT-015` — 送出前顯示並可更正種類、數量、價格、運費、總額、交付、付款、條款。\n- [ ] `CRT-016` — 雙擊/回上一頁/刷新/timeout/付款重試只產生合法單一副作用。\n\n### IDN 身分與會員\n\n- [ ] `IDN-001` — 註冊/登入/登出、generic credential error、rate limit、session rotation 通過。\n- [ ] `IDN-002` — 驗證信重寄/expired/used/invalid 與未驗證限制通過。\n- [ ] `IDN-003` — reset generic response、weak password 不耗 token、成功後撤銷舊 session。\n- [ ] `IDN-004` — Google/LINE only-if-ready、state/callback/canonical origin/error 回復通過。\n- [ ] `IDN-005` — 相同 Email 不自動接管；link challenge、already-linked、取消通過。\n- [ ] `IDN-006` — profile 欄位格式、空值、生日、電話、地址與錯誤狀態通過。\n- [ ] `IDN-007` — opt-in 可撤、tags/note 私密、公司欄位前後台權限通過。\n- [ ] `IDN-008` — 訂單 list/detail/tracking/empty；他人 ID 與不存在同回 404。\n- [ ] `IDN-009` — data export/deletion/hold/匿名化/通知與 audit 流程通過。\n- [ ] `IDN-010` — secure cookie、裝置/全裝置登出、Admin MFA/timeout/recovery code 通過。\n\n### PRC 價格與優惠\n\n- [ ] `PRC-001` — 全系統整數 TWD、折扣/運費/稅/退款分攤與 rounding invariant 通過。\n- [ ] `PRC-002` — fixed/percentage 0/負/100+、超過小計與 code normalization 通過。\n- [ ] `PRC-003` — order/product/category scope 在混合 cart 正確分攤。\n- [ ] `PRC-004` — status/start/end/min/total/per-customer limit 與併發兌換通過。\n- [ ] `PRC-005` — schedule/tier/mix offer 在時區邊界、order snapshot 與售罄狀態通過。\n- [ ] `PRC-006` — threshold/item/variant free shipping 的優先序與退款後顯示政策通過。\n- [ ] `PRC-007` — exclusive/combinable/priority、最佳合法價與 abuse rate limit 通過。\n- [ ] `PRC-008` — free gift/add-on 啟用時 eligibility、stock、remove trigger item 行為通過。\n- [ ] `PRC-009` — points/tier/referral 啟用時 ledger、expiry、refund reversal、防自推通過。\n\n### PAY 金流與發票\n\n- [ ] `PAY-001` — fake + 至少一個 sandbox adapter 完成相同 contract suite。\n- [ ] `PAY-002` — 本站不收卡號，redirect/form action allowlist、金額/訂單摘要與 CSP 通過。\n- [ ] `PAY-003` — signature/shop/order/amount/currency mismatch 全拒絕並告警。\n- [ ] `PAY-004` — payment state transition table、非法 capture/void/refund 與部分退款通過。\n- [ ] `PAY-005` — notify 重播/並行/CAS/timeout 只轉態與觸發一次。\n- [ ] `PAY-006` — query/reconcile/unknown outcome/人工補跑不二次扣款。\n- [ ] `PAY-007` — Admin filters/detail/raw-redacted/reauth/reason/permission 全通過。\n- [ ] `PAY-008` — captured 後開票一次；provider 失敗不回滾付款並可重試告警。\n- [ ] `PAY-009` — business/carrier/donate payload 格式與互斥、敏感遮罩通過。\n- [ ] `PAY-010` — void/allowance/reissue、部分退款金額與 invoice audit 一致。\n- [ ] `PAY-011` — 訂單/付款/發票信件內容、品牌模板、重試/退信/去重通過。\n\n### ORD 訂單生命週期\n\n- [ ] `ORD-001` — order 原子建立、唯一 orderNo、line/bundle/price/address 快照不隨來源變。\n- [ ] `ORD-002` — order/payment/fulfillment 三狀態分離、合法轉移與 UI mapping 通過。\n- [ ] `ORD-003` — anonymous status token/customer ownership/admin permission 防 IDOR 通過。\n- [ ] `ORD-004` — 搜尋 orderNo/name/email/product、狀態/日期/cursor 與長資料通過。\n- [ ] `ORD-005` — cancel request ownership/理由/一單一 pending/approve/reject/race 通過。\n- [ ] `ORD-006` — stale job 僅取消無付款/請款/履約候選，釋放庫存，可停用與重跑。\n- [ ] `ORD-007` — admin cancel 要理由/權限/reauth；已出貨或不合法狀態阻擋。\n- [ ] `ORD-008` — print/packing slip/CSV/batch 的 PII 權限、公式注入與逐筆結果通過。\n- [ ] `ORD-009` — 事件信在轉態一次發送；失敗不阻斷狀態並有營運待辦。\n- [ ] `ORD-010` — timeline/note/audit 依時間排序、來源/actor 清楚且不可竄改。\n- [ ] `ORD-011` — reorder/客服代客啟用時重驗 catalog/price/stock 並清楚標 actor。\n- [ ] `ORD-012` — legacy import preview/idempotency/counts、唯讀分區與新訂單統計隔離。\n\n### FUL 履約、物流與退換貨\n\n- [ ] `FUL-001` — partial/full fulfillment、ship/deliver/cancel 與 line quantity invariant 通過。\n- [ ] `FUL-002` — batch validation、部分失敗 retry、label 合併與不重建成功託運通過。\n- [ ] `FUL-003` — carrier/tracking/url allowlist、unknown carrier、會員顯示通過。\n- [ ] `FUL-004` — fake + 至少一個選定物流 provider 的 contract、timeout/retry/query/label 通過。\n- [ ] `FUL-005` — home/convenience/store pickup snapshot、店號失效/改名/地址通過。\n- [ ] `FUL-006` — tracking webhook/poll 去重、狀態不倒退、exception 告警通過。\n- [ ] `FUL-007` — RMA window/item/quantity/reason/photo/approve/reject 通過。\n- [ ] `FUL-008` — received/inspection/restock/refund jobs 可部分失敗後續跑。\n- [ ] `FUL-009` — exchange/reship 啟用時新履約、價差、庫存與通知通過。\n- [ ] `FUL-010` — partial return/refund/restock/invoice allowance 金額與數量 invariant 通過。\n\n### INV 庫存\n\n- [ ] `INV-001` — SKU/Variant 唯一 inventory item；舊 metadata 不再被當真相。\n- [ ] `INV-002` — restock/sale/return/damage/adjustment 的正負、原因與權限通過。\n- [ ] `INV-003` — stocked/reserved/available 在商品/庫存/訂單頁同口徑。\n- [ ] `INV-004` — 併發 checkout 不超賣；失敗 rollback/release；backorder 明確控制。\n- [ ] `INV-005` — low-stock threshold/list/event/notification 去重與恢復後 reset 通過。\n- [ ] `INV-006` — bundle min availability、component reservation/release/partial stock 通過。\n- [ ] `INV-007` — multi-location 啟用時 allocation/transfer/fulfillment location 通過。\n- [ ] `INV-008` — count snapshot/conflict/approval/difference movement/audit 通過。\n- [ ] `INV-009` — movement before/after/reference/operator/reason/export 與 append-only 通過。\n- [ ] `INV-010` — preorder/backorder 啟用時 ETA、上限、取消/退款與會員顯示通過。\n\n### ADM 後台與權限\n\n- [ ] `ADM-001` — dashboard KPI 定義、期間、空資料、待辦深連結與權限通過。\n- [ ] `ADM-002` — 商品、訂單、會員、折扣、庫存五個核心模組 CRUD/列表/錯誤/手機全鏈通過。\n- [ ] `ADM-003` — 金流/運費/內容/文章/報表/人員模組全鏈通過。\n- [ ] `ADM-004` — owner/admin/staff role label、預設與 downgrade/suspend 通過。\n- [ ] `ADM-005` — 商品、庫存、訂單、會員、折扣、報表、內容、文章、人員 permission matrix 通過。\n- [ ] `ADM-006` — page/Server Action/Admin API 三層攻擊重演，不只 UI 隱藏。\n- [ ] `ADM-007` — 未列 Admin write 403；mint key/自升 owner/改 owner/跨模組全阻擋。\n- [ ] `ADM-008` — invite/promote/suspend/seat config、expired invitation、duplicate identity 通過。\n- [ ] `ADM-009` — Admin MFA、reauth、session timeout/revoke、recovery 通過。\n- [ ] `ADM-010` — 敏感動作 before/after redacted diff、actor/requestId/reason append-only。\n- [ ] `ADM-011` — CSV encoding/header/normalize/preview/error/idempotency/formula injection 通過。\n- [ ] `ADM-012` — 搜尋/篩選/cursor/bulk/export 大資料、部分失敗、permission 通過。\n- [ ] `ADM-013` — 320/375px、44px、table overflow、鍵盤、讀屏與長字串通過。\n- [ ] `ADM-014` — 危險操作 impact/confirm/reason/reauth/rollback 或不可回復說明通過。\n\n### MKT 行銷與分析\n\n- [ ] `MKT-001` — Campaign code/slug/hero/products/start/end/OG 與結束後行為通過。\n- [ ] `MKT-002` — Banner/offer/featured schedule 在 Asia/Taipei 邊界同步切換。\n- [ ] `MKT-003` — template preview/token/必要欄位保護/版本/audit 通過。\n- [ ] `MKT-004` — send/delivery/bounce/suppression/retry/idempotency 與 PII 遮罩通過。\n- [ ] `MKT-005` — consent reject/accept/revoke/version/anonymous→member merge 通過。\n- [ ] `MKT-006` — GA4 view_item/add_to_cart/begin_checkout/purchase/refund schema 與去重通過。\n- [ ] `MKT-007` — GTM/Pixel 未同意不載入，撤回停止，CSP/third-party inventory 可查。\n- [ ] `MKT-008` — revenue/units/orders/AOV/ranking 與 order/payment/refund 定義對帳。\n- [ ] `MKT-009` — funnel/source/promo/return 分析時區、bot/internal traffic、缺資料說明通過。\n- [ ] `MKT-010` — abandoned automation 啟用時 consent、頻率、quiet hours、退訂通過。\n- [ ] `MKT-011` — wishlist/recommendation/segment 啟用時 privacy、empty、登入 merge 通過。\n\n### SEC 安全、個資與法遵\n\n- [ ] `SEC-001` — OWASP ASVS Level 2 control matrix 有 owner、evidence 與 exception。\n- [ ] `SEC-002` — server session/CSRF/Secure/HttpOnly/SameSite/rotation/revocation 通過。\n- [ ] `SEC-003` — customer/order/return/address/media object ownership 與 enumeration 攻擊通過。\n- [ ] `SEC-004` — least privilege/default deny/permission revoke/race/owner protection 通過。\n- [ ] `SEC-005` — schema/SQL/XSS/Markdown/upload/path/CSV injection 測試通過。\n- [ ] `SEC-006` — login/reset/search/cart/promo/checkout/webhook 的 user/IP/business-key 限流通過。\n- [ ] `SEC-007` — CORS allowlist、CSP、HSTS、frame/referrer/permissions headers production 驗。\n- [ ] `SEC-008` — webhook raw signature/time window/safe compare/replay/unknown event 通過。\n- [ ] `SEC-009` — 卡號不進系統/log，payment redirect integrity、PCI responsibility 紀錄完成。\n- [ ] `SEC-010` — 個資告知/目的/必要選填/consent version/source 可追溯。\n- [ ] `SEC-011` — retention/anonymize/export/delete/legal hold/backup re-delete 演練通過。\n- [ ] `SEC-012` — secret inventory/分環境/rotation/遮罩/離職撤權演練通過。\n- [ ] `SEC-013` — dependency/SAST/secret scan、critical patch SLA 與 exception 流程通過。\n\n### QLT 品質與交付\n\n- [ ] `QLT-001` — WCAG 2.2 AA 自動 + keyboard + screen reader + zoom 有證據。\n- [ ] `QLT-002` — 320/375/390/768/1280/1440、safe area、長字串、無橫溢通過。\n- [ ] `QLT-003` — LCP/INP/CLS 與 JS/image/font budget 在 staging/RUM 有門檻。\n- [ ] `QLT-004` — unit/contract/integration/E2E/manual 分層覆蓋每個風險域。\n- [ ] `QLT-005` — payment/webhook/inventory/refund/permission race/replay suite 通過。\n- [ ] `QLT-006` — Dev/Preview/Staging/Production 的 DB/Redis/bucket/credential/callback/analytics 隔離。\n- [ ] `QLT-007` — migration expand/contract、backup checksum、隔離 restore 與 RPO/RTO 證據。\n- [ ] `QLT-008` — log/error/metric/alert 有 requestId、redaction、runbook、告警測試。\n- [ ] `QLT-009` — CI type/lint/test/build/security/lockfile/provenance gate 通過。\n- [ ] `QLT-010` — deploy SHA/migration/DOM/health/provider smoke/flag/rollback 證據一致。\n- [ ] `QLT-011` — E2E/preview 使用 sandbox fixture；production smoke 無資料污染或有授權清理。\n- [ ] `QLT-012` — 台灣網路交易、條款、企業/商品/交付/付款/退貨資訊由 owner 覆核。\n- [ ] `QLT-013` — canonical/robots/sitemap/JSON-LD/redirect/broken link/indexability QA 通過。\n- [ ] `QLT-014` — 本清單每個 enabled Feature ID 至少有一個可重跑證據連結。\n\n---\n\n## 9. 上線前必要決策\n\n以下答案沒有確認前，AI 可以完成 adapter、fake、schema、UI 與 sandbox 流程，但不能假設正式政策：\n\n- 商品是否涉及食品、保健、醫材、酒類、預購或其他特殊法規。\n- 金流 provider、付款方式、授權/請款模式、退款責任與對帳 owner。\n- 宅配、超商、門市組合；費率、免運、偏遠/外島、配送 SLA 與異常件政策。\n- 發票 provider、統編/字軌、載具/捐贈、作廢/折讓/重開責任人。\n- 七日解除權適用或例外、退貨時窗、商品狀態、退貨運費、換貨與補寄政策。\n- 是否搬遷會員、商品、歷史訂單與 SEO URL；來源品質、合法性、mapping 與 rollback。\n- 後台角色、MFA、席次、資料保存期限、客服流程、告警窗口及 RPO/RTO。\n\n---\n\n## 10. Definition of Done\n\n整站只有在下列條件全部成立時才能稱為完成：\n\n- 164 個 Feature ID 都出現在專案狀態表；啟用項皆為 `verified`，N/A/P2 有決策理由。\n- 前台、後台、資料 migration、API、webhook、jobs、provider adapter 與營運復原流程形成完整鏈。\n- success、pending、fail、timeout、duplicate、out-of-order、空資料、loading、permission denied 皆有處理。\n- P0/P1 的測試與證據可由另一位工程師或 AI 在乾淨環境重跑。\n- Staging 完成完整正向交易，以及取消與退貨兩條逆向交易演練。\n- WCAG、RWD、效能、SEO、安全、個資、備份還原、觀測、告警、部署與回滾門檻通過。\n- 正式環境的版本、migration、health、實際 DOM/client bundle 與無副作用 smoke 相符。\n- 未完成、外部待辦、政策假設與風險明確揭露，沒有以 mock、靜態資料或 UI 截圖冒充正式可用。\n", "html": "<h3>台灣品牌型電商 AI 單一需求規格<\/h3><p>版本：2026-08-16  <\/p><p>適用：台灣單一品牌、單一商家、繁體中文、TWD 的 B2C 實體商品電商  <\/p><p>搭配文件：[<code>AI-BUILD-GUIDE.md<\/code>](AI-BUILD-GUIDE.md)<\/p><p>本文件是交給 AI 或工程團隊的單一功能與驗收依據。新案可以替換品牌視覺與 provider，但不得因此省略商務狀態、安全邊界、錯誤復原及驗收條件。<\/p><p>若某功能不適用：<\/p><p>- P0 原則上不得排除；排除前必須說明替代流程、風險、owner 與簽核。<\/p><p>- P1 為標準完整版預設交付；只有明確不適用時才能標記 <code>N/A<\/code>。<\/p><p>- P2 依商業需求啟用；未啟用仍保留 Feature ID。<\/p><p>所有功能狀態只能使用：<code>not_started<\/code>、<code>in_progress<\/code>、<code>implemented<\/code>、<code>verified<\/code>、<code>blocked<\/code>、<code>N/A<\/code>。只有附可重跑證據才能標成 <code>verified<\/code>。<\/p><hr><h3>1. 固定技術與資料邊界<\/h3><div style=\"overflow:auto\"><table><tr><td>層<\/td><td>母版決策<\/td><\/tr><tr><td>前台與自訂後台<\/td><td>Next.js App Router、React、TypeScript；依現有品牌視覺換皮<\/td><\/tr><tr><td>商務核心<\/td><td>Medusa v2，承擔商品、價格、購物車、訂單、庫存與促銷生命週期<\/td><\/tr><tr><td>永久資料<\/td><td>PostgreSQL 是唯一商務資料來源；禁止跨 Medusa/Supabase/自建表雙寫<\/td><\/tr><tr><td>快取與背景工作<\/td><td>Redis，用於 cache、lock、rate limit、job；不可當永久訂單總帳<\/td><\/tr><tr><td>媒體<\/td><td>S3 相容 object storage + CDN；不可依賴 ephemeral filesystem<\/td><\/tr><tr><td>外部服務<\/td><td>Payment、Invoice、Fulfillment、OAuth、Email 都以 provider adapter 隔離<\/td><\/tr><tr><td>付款資料<\/td><td>使用第三方託管付款頁；本站不接觸或記錄完整卡號<\/td><\/tr><tr><td>分析<\/td><td>先取得 consent 才載入非必要分析或行銷工具<\/td><\/tr><\/table><\/div><h3>硬性規則<\/h3><p>- 商品、Variant、價格、庫存、購物車、訂單與付款狀態只能各有一個權威寫入來源。<\/p><p>- Client 傳來的金額、折扣、庫存、角色、會員 ID、訂單所有權與付款結果一律不可信。<\/p><p>- 付款成功以簽章 webhook 或主動查詢確認；return URL 只顯示結果，不直接改狀態。<\/p><p>- 外部回呼、重試、按鈕雙擊、job 重跑與人工補跑都必須冪等。<\/p><p>- 訂單保存商品、價格、地址、發票、超商與組合內容快照，來源資料後改不得改寫歷史訂單。<\/p><p>- Payment、Order、Fulfillment、Return、Invoice 分開保存狀態，不建立互相矛盾的單一萬用 status。<\/p><p>- 所有 Admin page、Server Action、Route Handler、Commerce Admin API 都重新驗證 session 與 permission；UI 隱藏不算授權。<\/p><p>- 所有正式外部操作、正式資料 migration、部署、DNS、真實請退款與發票動作需要明確授權。<\/p><hr><h3>2. 品牌視覺契約<\/h3><p>AI 必須先從現有 repo、設計稿或網站抽取並沿用：<\/p><p>- Logo、安全留白、品牌色與語意色。<\/p><p>- display/body 字體、字級比例與 fallback。<\/p><p>- 容器寬度、grid、間距、圓角、邊框、陰影與圖片比例。<\/p><p>- Header、Footer、Button、Input、Card、Badge、Dialog、Drawer、Toast、Table 等元件語言。<\/p><p>- breakpoint、手機導覽、sticky CTA、safe area 與互動動效。<\/p><p>可以改版面細節，但每個互動元件都必須有 default、hover/focus、active、disabled/loading、error 狀態；所有可點目標至少 44×44 CSS px，支援 keyboard、screen reader、200% zoom 與 <code>prefers-reduced-motion<\/code>。<\/p><p>至少驗證 320×568、375×812、390×844、768×1024、1280×800、1440×900。整頁不可橫向溢出，長中文、Email、SKU、四位以上金額、空資料及錯誤資料不得破版。<\/p><hr><h3>3. 必備頁面與營運介面<\/h3><h3>顧客前台<\/h3><p>- 首頁、公告、活動 Landing、商品列表、分類/集合、搜尋、商品詳情。<\/p><p>- 購物車 drawer、完整購物車、結帳、付款導向、付款結果。<\/p><p>- 關於、品牌故事、技術/特色、FAQ、客服、文章列表與文章詳情。<\/p><p>- 隱私權、服務條款、退換貨政策、交易安全與 404。<\/p><h3>身分與會員<\/h3><p>- 註冊、登入、Email 驗證、忘記/重設密碼、可選 Google/LINE。<\/p><p>- 會員資料、地址簿、常用超商、偏好與行銷同意。<\/p><p>- 訂單列表、訂單詳情、物流追蹤、取消申請、退貨申請、資料匯出/刪除入口。<\/p><h3>營運後台<\/h3><p>- Dashboard 與營運待辦。<\/p><p>- 商品、Variant、分類、集合、媒體、組合、價格與促銷。<\/p><p>- 訂單、付款、發票、取消、退款、履約、物流、標籤與退貨 RMA。<\/p><p>- 庫存、異動、低庫存、盤點與庫位。<\/p><p>- 會員、標籤、客服備註、舊資料匯入。<\/p><p>- 首頁內容、Banner、品牌頁、FAQ、法務、文章與活動。<\/p><p>- 員工、角色、模組權限、MFA、Audit log、報表與系統狀態。<\/p><p>每頁都要有 loading、empty、error、permission denied 與 mutation failure 狀態；高風險操作顯示影響摘要、原因、二次確認，必要時重新驗證身分。<\/p><hr><h3>4. 核心資料模型<\/h3><p>實作可以沿用 Medusa 原生模型或等價 extension，但下列概念、關聯與約束不可消失：<\/p><div style=\"overflow:auto\"><table><tr><td>資料域<\/td><td>必備實體<\/td><\/tr><tr><td>品牌與身分<\/td><td>BrandConfig、Customer、CustomerIdentity、Address、PickupStorePreference、AdminUser、Role、Permission<\/td><\/tr><tr><td>商品與內容<\/td><td>Product、ProductVariant、ProductOption、Category、Collection、Tag、MediaAsset、BundleComponent、ContentEntry、Article、Campaign<\/td><\/tr><tr><td>價格與庫存<\/td><td>Price、Promotion、PromotionRedemption、InventoryItem、StockLocation、InventoryLevel、InventoryMovement、Reservation<\/td><\/tr><tr><td>交易<\/td><td>Cart、CartLine、CheckoutSession、Order、OrderLine、OrderAddressSnapshot<\/td><\/tr><tr><td>金流與發票<\/td><td>PaymentAttempt、PaymentTransaction、Invoice<\/td><\/tr><tr><td>履約與售後<\/td><td>Fulfillment、Shipment、CancelRequest、ReturnRequest、ReturnLine、Refund<\/td><\/tr><tr><td>營運與可靠性<\/td><td>ConsentRecord、NotificationDelivery、AuditLog、WebhookReceipt、IdempotencyRecord、OutboxEvent<\/td><\/tr><\/table><\/div><p>主要 invariant：<\/p><p>- SKU 與條碼依商家規則唯一；每個可販售 Variant 對應唯一庫存項目。<\/p><p>- <code>available = stocked - reserved<\/code>；扣庫、保留、釋放與 rollback 原子化，併發不得超賣。<\/p><p>- 金額以 TWD 整數保存；折扣、運費、稅、退款分攤使用同一 rounding 規則。<\/p><p>- Cart confirm 時重新讀取價格、優惠、販售期間、庫存與配送資格，差異需顯示並由使用者重新確認。<\/p><p>- Webhook 以 provider + event ID 或等價鍵去重；Idempotency key 的相同請求只能產生一次副作用。<\/p><p>- Audit log、Inventory movement、Payment transaction 與 webhook receipt 採 append-only 語意並遮罩敏感資料。<\/p><p>- 個資保存期限、刪除、匿名化、legal hold、備份還原後重新刪除都有可驗流程。<\/p><hr><h3>5. 交易與逆向流程<\/h3><h3>正向流程<\/h3><p><code>Cart → Checkout review → Pending payment → Authorized/Captured → Invoice issued → Processing → Shipped → Delivered<\/code><\/p><p>- 建立訂單與付款嘗試必須有 idempotency key。<\/p><p>- captured event 觸發開票、通知與可履約狀態；附屬服務失敗不回滾已完成付款，而是建立待辦、重試與告警。<\/p><p>- pending、failed、expired、cancelled、authorized、captured、partially_refunded、refunded 必須清楚區分。<\/p><h3>取消與逾期<\/h3><p>- 顧客只能在政策允許且未出貨時申請取消；同訂單同時只能有一個 pending request。<\/p><p>- 管理員核准後依付款狀態 void/refund，釋放或回補庫存，處理發票作廢/折讓並通知。<\/p><p>- 逾期 job 只能取消仍未付款、未請款、未履約的候選訂單；可安全重跑與停用。<\/p><h3>退貨與退款<\/h3><p><code>Delivered → Return requested → Approved → Received → Inspected → Restocked/Rejected → Refunded → Invoice allowance/void<\/code><\/p><p>- 支援部分品項與部分數量，所有 line quantity 與金額分攤維持一致。<\/p><p>- 收件、驗貨、回庫、退款及發票處理可分段失敗後續跑，不得靠單一長 transaction 呼叫多個外部服務。<\/p><hr><h3>6. API、事件與 provider 契約<\/h3><p>至少要有下列介面族群；實際 URL 可配合現有專案，但責任不可混淆：<\/p><p>- Public/CMS：首頁、品牌頁、FAQ、法務、文章、活動、metadata、sitemap。<\/p><p>- Catalog：商品、Variant、分類、集合、搜尋、篩選、庫存可售投影。<\/p><p>- Cart/Checkout：建立/讀取/合併 cart、line mutation、promotion、shipping、pickup store、invoice、review、confirm。<\/p><p>- Identity/Member：register/login/logout/verify/reset/OAuth link、profile、address、orders、cancel、return、privacy requests。<\/p><p>- Admin：catalog、content、pricing、inventory、orders、payments、invoice、fulfillment、returns、members、staff、permissions、audit、reports。<\/p><p>- Webhooks：payment、invoice、carrier；驗 raw body 簽章、時間窗、來源與 replay。<\/p><p>- Events：order placed、payment authorized/captured/failed/refunded、invoice issued/failed、fulfillment created/shipped/delivered、return transitions、stock low、notification failed。<\/p><p>Provider adapter 至少實作：<\/p><p>- <code>PaymentProvider<\/code>：create、authorize/capture、void、refund、query、verifyWebhook、normalizeStatus。<\/p><p>- <code>InvoiceProvider<\/code>：issue、void、allowance、reissue、query。<\/p><p>- <code>FulfillmentProvider<\/code>：quote/validate、createShipment、cancelShipment、label、tracking、verifyWebhook。<\/p><p>- <code>IdentityProvider<\/code>：startOAuth、verifyCallback、link/unlink，且只有設定完整時顯示入口。<\/p><p>每個 adapter 都先以 deterministic fake 跑相同 contract suite，再接 sandbox；測 success、pending、fail、timeout、duplicate、out-of-order、unknown outcome。<\/p><hr><h3>7. 實作優先級索引<\/h3><p>- <strong>P0 核心上線：99 項。<\/strong> 缺少即不得接受真實訂單。<\/p><p>- <strong>P1 標準完整版：56 項。<\/strong> 母版預設全部交付。<\/p><p>- <strong>P2 成長模組：9 項。<\/strong> 按案啟用。<\/p><p>P2 IDs：<code>CAT-013<\/code>、<code>CAT-014<\/code>、<code>PRC-008<\/code>、<code>PRC-009<\/code>、<code>ORD-011<\/code>、<code>FUL-009<\/code>、<code>INV-010<\/code>、<code>MKT-010<\/code>、<code>MKT-011<\/code>。除這九項外皆屬 P0 或 P1，預設必須交付或留下正式 N/A 決策。<\/p><hr><h3>8. 全功能驗收清單（164 項）<\/h3><p>勾選前要附 command、test report、log、requestId、screenshot、錄影或 sandbox reference 等可重跑證據。只有畫面或單一 happy path 不算完成。<\/p><h3>FND 平台與共用基礎<\/h3><p>- [ ] <code>FND-001<\/code> — 前台、後台、BFF、Commerce API 的 token/責任邊界經架構與 request 測試證明。<\/p><p>- [ ] <code>FND-002<\/code> — 商品、cart、order、inventory 只有一個權威寫入來源，無雙寫 path。<\/p><p>- [ ] <code>FND-003<\/code> — 品牌/Feature flag 有 schema、預設、Admin API 二次檢查與排除紀錄。<\/p><p>- [ ] <code>FND-004<\/code> — 缺少/矛盾 env 啟動即 fail；secrets 不出現在 client/log/repo。<\/p><p>- [ ] <code>FND-005<\/code> — Redis 斷線的快取/鎖/job 行為安全且可觀測。<\/p><p>- [ ] <code>FND-006<\/code> — outbox 重播不重做副作用；dead-letter 可查與補跑。<\/p><p>- [ ] <code>FND-007<\/code> — liveness/readiness 能區分 DB/Redis/provider degraded，health 無副作用。<\/p><p>- [ ] <code>FND-008<\/code> — TWD、Asia/Taipei 顯示/UTC 儲存、語系與稅設定集中且測日期邊界。<\/p><h3>CNT 內容與曝光<\/h3><p>- [ ] <code>CNT-001<\/code> — 首頁區塊由 CMS/config 組裝，壞資料不使全頁失敗。<\/p><p>- [ ] <code>CNT-002<\/code> — 公告/Banner/Promo 新增、排序、啟停、起訖與過期行為皆驗。<\/p><p>- [ ] <code>CNT-003<\/code> — 品牌內頁/FAQ 可編輯、預覽、發布且保有必要 fallback。<\/p><p>- [ ] <code>CNT-004<\/code> — 文章 CRUD、slug、分類、推薦、draft/publish/archive 與 404 權限通過。<\/p><p>- [ ] <code>CNT-005<\/code> — 四類法務頁有版本/生效日且 checkout 留存同意版本。<\/p><p>- [ ] <code>CNT-006<\/code> — 圖片 MIME/大小/像素/壓縮/排序/替換失敗/alt 都有驗收。<\/p><p>- [ ] <code>CNT-007<\/code> — media 跨部署持久；孤兒檔清理不刪仍被引用檔。<\/p><p>- [ ] <code>CNT-008<\/code> — 每個 indexable page 有正確 title/description/canonical/OG/share image。<\/p><p>- [ ] <code>CNT-009<\/code> — robots/sitemap/404/redirect 與 apex/www canonical 皆自動測。<\/p><p>- [ ] <code>CNT-010<\/code> — Product/Offer/Organization/Breadcrumb JSON-LD 與可見價格庫存一致。<\/p><p>- [ ] <code>CNT-011<\/code> — 搜尋支援輸入、清除、無結果建議、超時降級與 rate limit。<\/p><p>- [ ] <code>CNT-012<\/code> — draft preview 不可被索引/猜 URL 讀取；版本衝突與發布 audit 可見。<\/p><h3>CAT 商品目錄<\/h3><p>- [ ] <code>CAT-001<\/code> — Product create/update/publish/archive/delete 各自限制與歷史訂單不變。<\/p><p>- [ ] <code>CAT-002<\/code> — Category/Collection/Tag 關聯、排序、刪除與空分類行為通過。<\/p><p>- [ ] <code>CAT-003<\/code> — 多 Option/Variant、唯一 SKU/Barcode、組合合法性與 URL 選擇可驗。<\/p><p>- [ ] <code>CAT-004<\/code> — list/sale price、badge/status 時段與 TWD 顯示/計算一致。<\/p><p>- [ ] <code>CAT-005<\/code> — gallery/長圖/features/spec/content sections 手機、alt、壞資料通過。<\/p><p>- [ ] <code>CAT-006<\/code> — bundle/盒數/混搭快照、價錢、庫存、訂單/信件顯示一致。<\/p><p>- [ ] <code>CAT-007<\/code> — Variant 未開始/已結束/disabled/free shipping 在 PDP/cart/checkout 同步。<\/p><p>- [ ] <code>CAT-008<\/code> — PLP/PDP/分類/排序/分頁與 draft/archived 404 正確。<\/p><p>- [ ] <code>CAT-009<\/code> — price/stock/attribute filters 可分享、換條件清 cursor、無結果清楚。<\/p><p>- [ ] <code>CAT-010<\/code> — Admin 變更後下一個 public request 讀新版，無全站不必要 purge。<\/p><p>- [ ] <code>CAT-011<\/code> — 首頁/文章/相關商品只顯示可公開可購買項並有 fallback。<\/p><p>- [ ] <code>CAT-012<\/code> — import preview/commit/export 含欄位 mapping、invalid row、idempotency、安全 CSV。<\/p><p>- [ ] <code>CAT-013<\/code> — 評論啟用時驗購/審核/檢舉/平均分與結構化資料防造假。<\/p><p>- [ ] <code>CAT-014<\/code> — 通知/預購啟用時資格、同意、去重、庫存到貨與取消訂閱通過。<\/p><h3>CRT 購物車與結帳<\/h3><p>- [ ] <code>CRT-001<\/code> — server cart 重新整理/跨裝置策略與不可偽造 cart token 通過。<\/p><p>- [ ] <code>CRT-002<\/code> — add/update/remove/clear、0/負數/99+/重複 Variant 邊界通過。<\/p><p>- [ ] <code>CRT-003<\/code> — 匿名→登入 merge 有 quantity/invalid/price conflict 摘要且不遺失合法 line。<\/p><p>- [ ] <code>CRT-004<\/code> — drawer/full cart 同一 server projection，手機/鍵盤/讀屏可操作。<\/p><p>- [ ] <code>CRT-005<\/code> — confirm 前重新驗 price/promo/sale/stock，差異不靜默。<\/p><p>- [ ] <code>CRT-006<\/code> — expired/abandoned 狀態釋放 reservation、可復原政策與事件去重。<\/p><p>- [ ] <code>CRT-007<\/code> — Email/手機/郵遞區號/縣市區域/地址錯誤與 autocomplete 通過。<\/p><p>- [ ] <code>CRT-008<\/code> — 宅配/超商/門市切換清除不適用欄位，門市資料 server 驗證。<\/p><p>- [ ] <code>CRT-009<\/code> — 固定/滿額/商品免運在 cart、checkout、order snapshot 相同。<\/p><p>- [ ] <code>CRT-010<\/code> — 折扣套用/移除/過期/不適用/達上限/大小寫/競態通過。<\/p><p>- [ ] <code>CRT-011<\/code> — 訂單備註與配送備註分欄、長度/清理、後台/出貨單可見。<\/p><p>- [ ] <code>CRT-012<\/code> — 個人/公司/載具/捐贈欄位互斥與格式、order/invoice snapshot 通過。<\/p><p>- [ ] <code>CRT-013<\/code> — guest 能下單、查訂單與選擇註冊；不強迫建立重複帳號。<\/p><p>- [ ] <code>CRT-014<\/code> — address book/常用超商 CRUD、default 唯一與訂單快照不回寫。<\/p><p>- [ ] <code>CRT-015<\/code> — 送出前顯示並可更正種類、數量、價格、運費、總額、交付、付款、條款。<\/p><p>- [ ] <code>CRT-016<\/code> — 雙擊/回上一頁/刷新/timeout/付款重試只產生合法單一副作用。<\/p><h3>IDN 身分與會員<\/h3><p>- [ ] <code>IDN-001<\/code> — 註冊/登入/登出、generic credential error、rate limit、session rotation 通過。<\/p><p>- [ ] <code>IDN-002<\/code> — 驗證信重寄/expired/used/invalid 與未驗證限制通過。<\/p><p>- [ ] <code>IDN-003<\/code> — reset generic response、weak password 不耗 token、成功後撤銷舊 session。<\/p><p>- [ ] <code>IDN-004<\/code> — Google/LINE only-if-ready、state/callback/canonical origin/error 回復通過。<\/p><p>- [ ] <code>IDN-005<\/code> — 相同 Email 不自動接管；link challenge、already-linked、取消通過。<\/p><p>- [ ] <code>IDN-006<\/code> — profile 欄位格式、空值、生日、電話、地址與錯誤狀態通過。<\/p><p>- [ ] <code>IDN-007<\/code> — opt-in 可撤、tags/note 私密、公司欄位前後台權限通過。<\/p><p>- [ ] <code>IDN-008<\/code> — 訂單 list/detail/tracking/empty；他人 ID 與不存在同回 404。<\/p><p>- [ ] <code>IDN-009<\/code> — data export/deletion/hold/匿名化/通知與 audit 流程通過。<\/p><p>- [ ] <code>IDN-010<\/code> — secure cookie、裝置/全裝置登出、Admin MFA/timeout/recovery code 通過。<\/p><h3>PRC 價格與優惠<\/h3><p>- [ ] <code>PRC-001<\/code> — 全系統整數 TWD、折扣/運費/稅/退款分攤與 rounding invariant 通過。<\/p><p>- [ ] <code>PRC-002<\/code> — fixed/percentage 0/負/100+、超過小計與 code normalization 通過。<\/p><p>- [ ] <code>PRC-003<\/code> — order/product/category scope 在混合 cart 正確分攤。<\/p><p>- [ ] <code>PRC-004<\/code> — status/start/end/min/total/per-customer limit 與併發兌換通過。<\/p><p>- [ ] <code>PRC-005<\/code> — schedule/tier/mix offer 在時區邊界、order snapshot 與售罄狀態通過。<\/p><p>- [ ] <code>PRC-006<\/code> — threshold/item/variant free shipping 的優先序與退款後顯示政策通過。<\/p><p>- [ ] <code>PRC-007<\/code> — exclusive/comb function exportRecord(){const safe=s=>String(s||'待填').replace(/\n/g,' ');let md='# 電商標準化提案｜會議紀錄\n\n匯出時間：'+new Date().toLocaleString('zh-TW',{timeZone:'Asia/Taipei'})+'（台北）\n\n## 模組可行性與啟動要素\n\n';decisionNames.forEach((n,i)=>{const d=record.moduleDecisions[i]||{};md+=`### ${n}\n\n- 結論：${safe(d.status||'待決策')}\n- 主責／日期：${safe(d.owner)}\n- 理由／調整：${safe(d.note)}\n\n`});md+='## 功能採用\n\n以下只有本次已選項目；沒有列出的仍待決策，並非排除。\n\n';const fs=DATA.features.filter(f=>record.features[f.id]&&record.features[f.id]!=='待決策');md+=fs.length?fs.map(f=>`- ${f.id} ${f.name}：${record.features[f.id]}`).join('\n'):'尚未選擇。';md+='\n\n延後／不適用的理由與負責人，請補在會議紀錄。';md+=plannerMarkdown();const blob=new Blob([md],{type:'text/markdown;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='電商標準化_會議紀錄_'+new Date().toISOString().slice(0,10)+'.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('已匯出會議紀錄。')}

function planSummary(){const items=planItems();const sums={estimate:0,actual:0,estCount:0,actCount:0};for(const item of items){const w=planner.work[item.id]||{};for(const [field,count] of [['estimate','estCount'],['actual','actCount']])if(w[field]!==undefined&&w[field]!==''){sums[field]+=Number(w[field]);sums[count]++}}

function renderPlanner(){ $('plan-kind').value=planner.kind;$('plan-design').value=planner.design;$('plan-design-label').textContent=designLevels[planner.design];$('plan-library').innerHTML=planOptions.filter(x=>x.type==='all'||planner.kind==='shop').map(x=>`<div class="plan-option" draggable="true" data-plan-drag="${x.id}"><div><strong>${x.name}</strong><small>${x.value}</small></div><button type="button" data-plan-add="${x.id}" ${planner.selected.includes(x.id)?'disabled':''}>${planner.selected.includes(x.id)?'已加入':'＋ 加入'}</button></div>`).join('');$('plan-selected').innerHTML=planItems().map(x=>{const w=planner.work[x.id]||{};return `<div class="plan-work"><div class="plan-work-title"><strong>${esc(x.name)}</strong>${planOptions.some(o=>o.id===x.id)?`<button type="button" data-plan-remove="${x.id}" aria-label="移除${esc(x.name)}">移除</button>`:'<span class="small">'+(x.id.startsWith('base_')?'方案標配':'設計升級')+'</span>'}</div><p>${esc(x.value)}</p><div class="plan-hours"><label>預估（小時）<input type="number" min="0" step="0.5" data-work="${x.id}" data-work-field="estimate" value="${esc(w.estimate??'')}" placeholder="待填"></label><label>實際（小時）<input type="number" min="0" step="0.5" data-work="${x.id}" data-work-field="actual" value="${esc(w.actual??'')}" placeholder="待填"></label><label>完成日期<input type="date" data-work="${x.id}" data-work-field="date" value="${esc(w.date||'')}"></label></div></div>`}).join('');planSummary();fitSlide()}
