name: Windows desktop beta
on:
  push:
    branches: [codex/windows-desktop-release]
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the verified installer to the matching beta release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test desktop/*.test.cjs
      - run: pnpm desktop:dist:win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install and verify packaged app
        shell: pwsh
        run: |
          $installer = Get-Item release/desktop/Huddle-*-win-x64.exe
          $installDir = Join-Path $env:RUNNER_TEMP 'Huddle-installed'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          node scripts/tests/windows-desktop-smoke.cjs "$installDir/Huddle.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged app smoke test failed' }
          Get-FileHash $installer.FullName -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($installer.Name)" } | Set-Content release/desktop/WINDOWS-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: huddle-windows-x64
          path: |
            release/desktop/*.exe
            release/desktop/WINDOWS-SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke-evidence
          path: release/desktop/windows-smoke.png
          if-no-files-found: ignore

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: huddle-windows-x64
          path: windows-release
      - name: Publish verified Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}-beta.1"
          gh release view "$tag"
          cd windows-release
          sha256sum --check WINDOWS-SHA256SUMS.txt
          gh release upload "$tag" "Huddle-${version}-win-x64.exe" WINDOWS-SHA256SUMS.txt --clobber
